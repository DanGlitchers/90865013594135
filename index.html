                "blacksun": {
                    "html": "\u003cstyle>\n    .bsg-container {\n        width: 100%;\n        height: 100%;\n        display: flex;\n        align-items: center;\n        justify-content: center;\n        font-family: 'IBM Plex Mono', monospace;\n        color: #fff;\n        background: #050505;\n        position: relative;\n        overflow: hidden;\n        text-shadow: 0 0 10px rgba(255,255,255,0.5);\n    }\n    .bsg-scanlines { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1)); background-size: 100% 4px; pointer-events: none; opacity: 0.5; z-index: 1; }\n    .bsg-vignette { position: absolute; inset: 0; background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,1) 100%); pointer-events: none; z-index: 2; }\n    .bsg-stage { position: relative; z-index: 5; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; direction: ltr; transition: opacity 0.4s; }\n    .bsg-stage.fade-out { opacity: 0; pointer-events: none; }\n    .bsg-logo { max-width: 110px; width: 18%; height: auto; margin-bottom: 24px; filter: drop-shadow(0 0 20px rgba(255,255,255,0.6)); user-select: none; -webkit-user-drag: none; }\n    .bsg-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; width: 100%; max-width: 720px; margin-bottom: 24px; }\n    @media (max-width: 600px) { .bsg-grid { grid-template-columns: repeat(4, 1fr); gap: 10px; } }\n    .bsg-slot { display: flex; flex-direction: column; gap: 3px; }\n    .bsg-type { font-size: 0.6rem; text-align: center; color: #444; cursor: pointer; padding: 3px 0; border-bottom: 1px solid transparent; transition: all 0.2s; user-select: none; font-family: 'IBM Plex Mono', monospace; }\n    .bsg-type:hover { color: #888; }\n    .bsg-type.active { color: #fff; border-bottom-color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.5); }\n    .bsg-val { aspect-ratio: 1; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; cursor: pointer; transition: all 0.1s; background: rgba(255,255,255,0.02); color: #fff; font-weight: bold; user-select: none; }\n    .bsg-val:hover { border-color: #fff; background: rgba(255,255,255,0.08); box-shadow: 0 0 12px rgba(255,255,255,0.1); transform: scale(1.05); z-index: 2; }\n    .bsg-val:active { background: #fff; color: #000; transform: scale(0.95); }\n    .bsg-val.success { border-color: #00ff41; color: #00ff41; box-shadow: 0 0 18px #00ff41; }\n    .bsg-btn { background: transparent; color: #fff; border: 1px solid #fff; padding: 14px 48px; font-size: 1rem; font-weight: bold; font-family: inherit; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; box-shadow: 0 0 15px rgba(255,255,255,0.1); margin-bottom: 10px; }\n    .bsg-btn:hover { background: #fff; color: #000; box-shadow: 0 0 30px rgba(255,255,255,0.4); }\n    .bsg-btn:disabled { opacity: 0.5; cursor: not-allowed; }\n    .bsg-msg { font-size: 0.75rem; letter-spacing: 2px; color: #444; min-height: 1em; text-align: center; transition: color 0.4s; text-transform: uppercase; }\n    .bsg-msg.ok { color: #00ff41; text-shadow: 0 0 10px #00ff41; }\n    .bsg-msg.err { color: #ff3333; text-shadow: 0 0 10px #ff3333; }\n    .bsg-grid.shake { animation: bsg-shake 0.4s ease-in-out; }\n    @keyframes bsg-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }\n\u003c/style>\n\n\u003cdiv class=\"bsg-container\" id=\"bsg-container\">\n    \u003cdiv class=\"bsg-scanlines\">\u003c/div>\n    \u003cdiv class=\"bsg-vignette\">\u003c/div>\n    \u003cdiv class=\"bsg-stage\" id=\"bsg-stage\">\n        \u003cimg src=\"https://lh3.googleusercontent.com/pw/AP1GczM8kfJbNSgwAfVMm9oIEKK8bZvDoIT_Br9e3Bv6JVSvxQVWa-DFckWEEqjUOWiosXf3sL2iZ59aBiKzBAHqLtrWtJIFbE23HPuFqm6lBQU-zrrs5Qk=w2400\" class=\"bsg-logo\">\n        \u003cdiv class=\"bsg-grid\" id=\"bsg-grid\">\u003c/div>\n        \u003cbutton class=\"bsg-btn\" id=\"bsg-btn\">אתחול\u003c/button>\n        \u003cdiv class=\"bsg-msg\" id=\"bsg-msg\">&nbsp;\u003c/div>\n    \u003c/div>\n\u003c/div>\n\n\u003cscript type=\"application/json\" id=\"prefab-params\">\n{\n    \"successFlag\": { \"type\": \"text\", \"label\": \"דגל מקומי בהצלחה (Set Flag)\", \"default\": \"blacksun_core_unlocked\" },\n    \"successGlobal\": { \"type\": \"text\", \"label\": \"דגל גלובלי בהצלחה (Trigger Global)\", \"default\": \"\" },\n    \"successPrefab\": { \"type\": \"text\", \"label\": \"פתיחת Prefab בהצלחה (Prefab ID)\", \"default\": \"\" },\n    \"successRoom\": { \"type\": \"text\", \"label\": \"מעבר לחדר בהצלחה (Room ID)\", \"default\": \"\" },\n    \"successFade\": { \"type\": \"select\", \"label\": \"פייד לשחור לפני המעבר\", \"options\": [\"yes\", \"no\"], \"default\": \"yes\" },\n    \"lockSeconds\": { \"type\": \"text\", \"label\": \"משך נעילה לאחר טעות (שניות)\", \"default\": \"60\" },\n    \"successSound\": { \"type\": \"text\", \"label\": \"צליל הצלחה (URL / pool:name)\", \"default\": \"\" },\n    \"errorSound\": { \"type\": \"text\", \"label\": \"צליל שגיאה (URL / pool:name)\", \"default\": \"\" },\n    \"closeOnSuccess\": { \"type\": \"select\", \"label\": \"סגור אוטומטית אחרי הצלחה\", \"options\": [\"yes\", \"no\"], \"default\": \"yes\" }\n}\n\u003c/script>\n\n\u003cscript>\n(function() {\n    const LOCK_KEY = 'bsg_lock_until';\n\n    const params = (window.GameAPI && window.GameAPI.params) || {};\n    const lockSeconds = Math.max(0, parseInt(params.lockSeconds, 10) || 60);\n    const closeOnSuccess = (params.closeOnSuccess || 'yes') !== 'no';\n\n    async function sha256Hex(str) {\n        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));\n        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');\n    }\n\n    // One-shot read via GameAPI.watchDoc: shares the runtime's Firebase app\n    // (and Discord-authed identity), unlike a parallel firebase v8 init which\n    // would always be anonymous. Resolves with the doc data or null.\n    function readDocOnce(path, timeoutMs) {\n        return new Promise((resolve, reject) => {\n            if (typeof GameAPI.watchDoc !== 'function') {\n                reject(new Error('runtime missing watchDoc'));\n                return;\n            }\n            let done = false;\n            let unsub = null;\n            const finish = (fn, arg) => {\n                if (done) return;\n                done = true;\n                try { if (unsub) unsub(); } catch (_) {}\n                fn(arg);\n            };\n            const timer = setTimeout(() => finish(reject, new Error('timeout')), timeoutMs || 5000);\n            unsub = GameAPI.watchDoc(path, (data) => {\n                clearTimeout(timer);\n                finish(resolve, data);\n            });\n        });\n    }\n\n    const gridEl = document.getElementById('bsg-grid');\n    const btn = document.getElementById('bsg-btn');\n    const msg = document.getElementById('bsg-msg');\n\n    let audioCtx = null;\n    function tone(freq, type, dur, slide) {\n        try {\n            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n            if (audioCtx.state === 'suspended') audioCtx.resume();\n            const osc = audioCtx.createOscillator();\n            const g = audioCtx.createGain();\n            osc.type = type;\n            osc.frequency.value = freq;\n            g.gain.setValueAtTime(0.08, audioCtx.currentTime);\n            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);\n            if (slide) osc.frequency.exponentialRampToValueAtTime(freq / 2, audioCtx.currentTime + dur);\n            osc.connect(g); g.connect(audioCtx.destination);\n            osc.start();\n            osc.stop(audioCtx.currentTime + dur);\n        } catch (_) {}\n    }\n    const SFX = {\n        click: () => tone(800, 'square', 0.04, false),\n        error: () => tone(150, 'sawtooth', 0.3, true),\n        success: () => { tone(440, 'sine', 0.1, false); setTimeout(() => tone(880, 'sine', 0.3, false), 100); }\n    };\n\n    const seqData = Array.from({ length: 16 }, () => ({ type: 'ספרה', val: 0 }));\n\n    function setMsg(text, cls) {\n        msg.textContent = text || ' ';\n        msg.className = 'bsg-msg' + (cls ? ' ' + cls : '');\n    }\n\n    function buildGrid() {\n        gridEl.innerHTML = '';\n        seqData.forEach((d, i) => {\n            const slot = document.createElement('div');\n            slot.className = 'bsg-slot';\n            const t = document.createElement('div');\n            t.className = 'bsg-type' + (d.type === 'ספרה' ? ' active' : '');\n            t.id = 'bsg-type-' + i;\n            t.textContent = d.type;\n            t.addEventListener('click', () => swapType(i));\n            const v = document.createElement('div');\n            v.className = 'bsg-val';\n            v.id = 'bsg-val-' + i;\n            v.textContent = d.val;\n            v.addEventListener('click', () => nextVal(i));\n            slot.appendChild(t);\n            slot.appendChild(v);\n            gridEl.appendChild(slot);\n        });\n    }\n\n    function swapType(i) {\n        SFX.click();\n        const d = seqData[i];\n        d.type = d.type === 'ספרה' ? 'אות' : 'ספרה';\n        d.val = d.type === 'ספרה' ? 0 : 'A';\n        updateSlot(i);\n    }\n    function nextVal(i) {\n        SFX.click();\n        const d = seqData[i];\n        if (d.type === 'ספרה') d.val = d.val === 9 ? 0 : d.val + 1;\n        else {\n            const c = String(d.val).charCodeAt(0);\n            d.val = c === 90 ? 'A' : String.fromCharCode(c + 1);\n        }\n        updateSlot(i);\n    }\n    function updateSlot(i) {\n        const d = seqData[i];\n        const t = document.getElementById('bsg-type-' + i);\n        const v = document.getElementById('bsg-val-' + i);\n        t.textContent = d.type;\n        if (d.type === 'ספרה') t.classList.add('active'); else t.classList.remove('active');\n        v.textContent = d.val;\n    }\n\n    function flashWrong(reasonText) {\n        SFX.error();\n        if (params.errorSound) { try { GameAPI.playSound(params.errorSound); } catch (_) {} }\n        gridEl.classList.add('shake');\n        setTimeout(() => gridEl.classList.remove('shake'), 400);\n        if (reasonText) setMsg(reasonText, 'err');\n    }\n\n    function lockoutRemainingMs() {\n        const until = parseInt(localStorage.getItem(LOCK_KEY), 10) || 0;\n        return Math.max(0, until - Date.now());\n    }\n\n    async function verify() {\n        SFX.click();\n\n        const remaining = lockoutRemainingMs();\n        if (remaining > 0) {\n            flashWrong('ננעל (' + Math.ceil(remaining / 1000) + ')');\n            return;\n        }\n\n        const seq = seqData.map(d => d.val).join('').toUpperCase();\n        if (seq.length !== 16) { flashWrong('רצף לא שלם'); return; }\n\n        try {\n            btn.disabled = true;\n            const hash = await sha256Hex(seq);\n            const data = await readDocOnce('black_sun_sequence/' + hash);\n            if (data) {\n                SFX.success();\n                if (params.successSound) { try { GameAPI.playSound(params.successSound); } catch (_) {} }\n                document.querySelectorAll('.bsg-val').forEach(e => e.classList.add('success'));\n                setMsg('אומת', 'ok');\n                if (params.successFlag) { try { GameAPI.setFlag(params.successFlag); } catch (_) {} }\n                if (params.successGlobal) { try { GameAPI.triggerGlobal(params.successGlobal); } catch (_) {} }\n                const targetPrefab = (params.successPrefab || '').trim();\n                const targetRoom = (params.successRoom || '').trim();\n                if (targetPrefab) {\n                    setTimeout(() => {\n                        try { GameAPI.openPrefab(targetPrefab); } catch (_) {}\n                    }, 1200);\n                } else if (targetRoom) {\n                    setTimeout(async () => {\n                        try {\n                            if ((params.successFade || 'yes') !== 'no' && GameAPI.fadeToBlack) {\n                                await GameAPI.fadeToBlack(800);\n                            }\n                            GameAPI.goToRoom(targetRoom);\n                        } catch (_) {}\n                    }, 1200);\n                } else if (closeOnSuccess) {\n                    setTimeout(() => { try { GameAPI.close(); } catch (_) {} }, 1200);\n                }\n            } else {\n                if (lockSeconds > 0) localStorage.setItem(LOCK_KEY, String(Date.now() + lockSeconds * 1000));\n                flashWrong(lockSeconds > 0 ? 'המתן 15 שניות' : 'שגיאה');\n                btn.disabled = false;\n            }\n        } catch (e) {\n            flashWrong('שגיאת רשת');\n            btn.disabled = false;\n        }\n    }\n\n    btn.addEventListener('click', verify);\n\n    buildGrid();\n    setMsg('');\n\n    if (lockoutRemainingMs() > 0) {\n        flashWrong('ננעל (' + Math.ceil(lockoutRemainingMs() / 1000) + ')');\n    }\n})();\n\u003c/script>\n",

                    "html": "\u003cstyle>\n    .bsp-container {\n        width: 100%;\n        height: 100%;\n        background: #050505;\n        color: #fff;\n        font-family: 'IBM Plex Mono', monospace;\n        position: relative;\n        overflow: hidden;\n        text-shadow: 0 0 10px rgba(255,255,255,0.4);\n    }\n    .bsp-scanlines { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1)); background-size: 100% 4px; pointer-events: none; opacity: 0.5; z-index: 1; }\n    .bsp-vignette { position: absolute; inset: 0; background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,1) 100%); pointer-events: none; z-index: 2; }\n    .bsp-stage {\n        position: relative; z-index: 5;\n        width: 100%; height: 100%;\n        display: flex; flex-direction: column;\n        align-items: center; justify-content: center;\n        gap: 20px;\n        padding: 20px;\n        box-sizing: border-box;\n        direction: rtl;\n        transition: opacity 0.4s;\n    }\n    .bsp-stage.fade-out { opacity: 0; pointer-events: none; }\n\n    .bsp-title {\n        font-size: clamp(0.9rem, 2.2vw, 1.4rem);\n        letter-spacing: 4px;\n        font-weight: 700;\n        text-align: center;\n        text-transform: uppercase;\n    }\n\n    .bsp-counter {\n        font-size: clamp(2.5rem, 7vw, 5rem);\n        font-weight: 900;\n        letter-spacing: 1px;\n        line-height: 1;\n        direction: ltr;\n        transition: color 0.6s, text-shadow 0.6s;\n        text-shadow: 0 0 20px rgba(255,255,255,0.25);\n    }\n    .bsp-counter span {\n        font-size: 0.35em;\n        color: #666;\n        margin-left: 0.25em;\n        vertical-align: middle;\n        text-shadow: none;\n    }\n    .bsp-counter.active { color: #fff; }\n    .bsp-counter.warm   { color: #ffd24a; text-shadow: 0 0 24px rgba(255,210,74,0.4); }\n    .bsp-counter.hot    { color: #00ff41; text-shadow: 0 0 30px rgba(0,255,65,0.6); }\n\n    .bsp-pulse-wrapper {\n        position: relative;\n        width: clamp(180px, 32vw, 260px);\n        aspect-ratio: 1 / 1;\n        display: flex;\n        align-items: center;\n        justify-content: center;\n    }\n    .bsp-pulse-ring {\n        position: absolute;\n        inset: 0;\n        border-radius: 50%;\n        border: 1px solid #333;\n        animation: bsp-breathe 3s infinite ease-in-out;\n        pointer-events: none;\n    }\n    .bsp-pulse-ring.r2 { animation-delay: 0.6s; opacity: 0.5; }\n    @keyframes bsp-breathe {\n        0%, 100% { transform: scale(1);    opacity: 0.30; }\n        50%      { transform: scale(1.08); opacity: 0.65; }\n    }\n\n    /* Progress ring — fills clockwise from the top over MIN_HOLD_MS while held,\n       snaps back instantly on release before completion, locks green on success. */\n    .bsp-progress {\n        position: absolute;\n        inset: 0;\n        width: 100%;\n        height: 100%;\n        pointer-events: none;\n        z-index: 11;\n        transform: rotate(-90deg); /* start the stroke from 12 o'clock */\n        overflow: visible; /* let the green drop-shadow spill past the SVG bbox */\n    }\n    .bsp-progress circle {\n        stroke-dasharray: 100;\n        stroke-dashoffset: 100;\n        stroke: #ff4d00;\n        filter: drop-shadow(0 0 6px rgba(255,77,0,0.5));\n        transition: stroke 0.3s, filter 0.3s;\n    }\n    .bsp-progress.charging circle {\n        stroke-dashoffset: 0;\n        transition: stroke-dashoffset 3000ms linear, stroke 0.3s, filter 0.3s;\n    }\n    .bsp-progress.complete circle {\n        stroke-dashoffset: 0;\n        stroke: #00ff41;\n        filter: drop-shadow(0 0 12px rgba(0,255,65,0.7));\n    }\n\n    .bsp-hold-btn {\n        position: relative;\n        width: 86%;\n        height: 86%;\n        border-radius: 50%;\n        background: #000;\n        border: 2px solid #fff;\n        cursor: pointer;\n        display: flex;\n        align-items: center;\n        justify-content: center;\n        padding: 0;\n        z-index: 10;\n        transition: transform 0.1s, box-shadow 0.3s, background 0.2s;\n        box-shadow: 0 0 20px rgba(255,255,255,0.12);\n        user-select: none;\n        -webkit-touch-callout: none;\n        -webkit-tap-highlight-color: transparent;\n    }\n    .bsp-hold-btn:active { transform: scale(0.97); }\n    .bsp-hold-btn.holding {\n        background: #fff;\n        box-shadow: 0 0 50px rgba(255,255,255,0.85);\n    }\n    .bsp-hold-btn.holding .bsp-logo { filter: drop-shadow(0 0 10px rgba(0,0,0,0.4)) invert(1); }\n    .bsp-logo {\n        width: 60%;\n        height: auto;\n        pointer-events: none;\n        filter: drop-shadow(0 0 16px rgba(255,255,255,0.55));\n        transition: filter 0.2s;\n    }\n\n    .bsp-hint {\n        font-size: 0.7rem;\n        letter-spacing: 3px;\n        color: #555;\n        text-transform: uppercase;\n        min-height: 1em;\n        text-align: center;\n    }\n\n    .bsp-stage.success .bsp-counter { color: #00ff41; text-shadow: 0 0 40px #00ff41; }\n    .bsp-stage.success .bsp-hold-btn { background: #fff; border-color: #00ff41; box-shadow: 0 0 70px rgba(0,255,65,0.8); }\n    .bsp-stage.success .bsp-pulse-ring { border-color: #00ff41; }\n\u003c/style>\n\n\u003cdiv class=\"bsp-container\">\n    \u003cdiv class=\"bsp-scanlines\">\u003c/div>\n    \u003cdiv class=\"bsp-vignette\">\u003c/div>\n    \u003cdiv class=\"bsp-stage\" id=\"bsp-stage\">\n        \u003cdiv class=\"bsp-title\">פרוטוקול שמש שחורה: הפעלה\u003c/div>\n        \u003cdiv class=\"bsp-counter\" id=\"bsp-counter\">0\u003cspan id=\"bsp-target\">/11\u003c/span>\u003c/div>\n        \u003cdiv class=\"bsp-pulse-wrapper\">\n            \u003cdiv class=\"bsp-pulse-ring\">\u003c/div>\n            \u003cdiv class=\"bsp-pulse-ring r2\">\u003c/div>\n            \u003csvg class=\"bsp-progress\" id=\"bsp-progress\" viewBox=\"0 0 100 100\">\n                \u003ccircle cx=\"50\" cy=\"50\" r=\"48\" fill=\"none\" stroke-width=\"2.5\" stroke-linecap=\"round\" pathLength=\"100\" />\n            \u003c/svg>\n            \u003cbutton class=\"bsp-hold-btn\" id=\"bsp-hold\" aria-label=\"החזק\">\n                \u003cimg class=\"bsp-logo\" id=\"bsp-logo\" src=\"https://lh3.googleusercontent.com/pw/AP1GczM8kfJbNSgwAfVMm9oIEKK8bZvDoIT_Br9e3Bv6JVSvxQVWa-DFckWEEqjUOWiosXf3sL2iZ59aBiKzBAHqLtrWtJIFbE23HPuFqm6lBQU-zrrs5Qk=w2400\" alt=\"\">\n            \u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"bsp-hint\" id=\"bsp-hint\">החזק\u003c/div>\n    \u003c/div>\n\u003c/div>\n\n\u003cscript type=\"application/json\" id=\"prefab-params\">\n{\n    \"target\": { \"type\": \"text\", \"label\": \"מספר אוחזים נדרש\", \"default\": \"11\" },\n    \"successFlag\": { \"type\": \"text\", \"label\": \"דגל מקומי בהצלחה (Set Flag)\", \"default\": \"blacksun_protocol_complete\" },\n    \"successRoom\": { \"type\": \"text\", \"label\": \"מעבר לחדר בהצלחה (Room ID)\", \"default\": \"\" },\n    \"successFade\": { \"type\": \"select\", \"label\": \"פייד לשחור לפני המעבר\", \"options\": [\"yes\", \"no\"], \"default\": \"yes\" },\n    \"successSound\": { \"type\": \"text\", \"label\": \"צליל הצלחה (URL / pool:name)\", \"default\": \"\" },\n    \"pauseSeconds\": { \"type\": \"text\", \"label\": \"השהיה לפני סגירה (שניות)\", \"default\": \"1.5\" },\n    \"closeOnSuccess\": { \"type\": \"select\", \"label\": \"סגור אוטומטית אם אין חדר יעד\", \"options\": [\"yes\", \"no\"], \"default\": \"yes\" }\n}\n\u003c/script>\n\n\u003cscript>\n(function() {\n    const params = (window.GameAPI && window.GameAPI.params) || {};\n    const TARGET = Math.max(1, parseInt(params.target, 10) || 11);\n    const PAUSE_MS = Math.max(0, Math.round((parseFloat(params.pauseSeconds) || 1.5) * 1000));\n    const closeOnSuccess = (params.closeOnSuccess || 'yes') !== 'no';\n    const successFade = (params.successFade || 'yes') !== 'no';\n\n    const stage = document.getElementById('bsp-stage');\n    const counterEl = document.getElementById('bsp-counter');\n    const targetEl = document.getElementById('bsp-target');\n    const holdBtn = document.getElementById('bsp-hold');\n    const hint = document.getElementById('bsp-hint');\n    const progress = document.getElementById('bsp-progress');\n    targetEl.textContent = '/' + TARGET;\n    let chargedTimer = null;\n\n    let audioCtx = null;\n    function tone(freq, type, dur, slide, vol) {\n        try {\n            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n            if (audioCtx.state === 'suspended') audioCtx.resume();\n            const osc = audioCtx.createOscillator();\n            const g = audioCtx.createGain();\n            osc.type = type;\n            osc.frequency.value = freq;\n            g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);\n            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);\n            if (slide) osc.frequency.exponentialRampToValueAtTime(freq / 2, audioCtx.currentTime + dur);\n            osc.connect(g); g.connect(audioCtx.destination);\n            osc.start();\n            osc.stop(audioCtx.currentTime + dur);\n        } catch (_) {}\n    }\n    const SFX = {\n        click: () => tone(720, 'square', 0.04, false, 0.06),\n        success: () => {\n            tone(523, 'sine', 0.18, false, 0.10);\n            setTimeout(() => tone(659, 'sine', 0.18, false, 0.10), 140);\n            setTimeout(() => tone(880, 'sine', 0.55, false, 0.10), 290);\n        },\n        charged: () => {\n            tone(880, 'sine', 0.18, false, 0.09);\n            setTimeout(() => tone(1320, 'sine', 0.22, false, 0.08), 90);\n        }\n    };\n\n    // Charging hum — rising sine that tracks the 3s progress ring.\n    // Auto-decays at 3.05s so a perfectly-held release ends cleanly; on early\n    // release stopChargingTone() ramps gain to silence in ~80ms.\n    let chargingOsc = null;\n    let chargingGain = null;\n    function startChargingTone() {\n        try {\n            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n            if (audioCtx.state === 'suspended') audioCtx.resume();\n            stopChargingTone(true);\n            const now = audioCtx.currentTime;\n            const osc = audioCtx.createOscillator();\n            const g = audioCtx.createGain();\n            osc.type = 'sine';\n            osc.frequency.setValueAtTime(220, now);\n            osc.frequency.exponentialRampToValueAtTime(660, now + 3);\n            g.gain.setValueAtTime(0.0001, now);\n            g.gain.exponentialRampToValueAtTime(0.07, now + 0.2);\n            g.gain.setValueAtTime(0.07, now + 2.9);\n            g.gain.exponentialRampToValueAtTime(0.001, now + 3.1);\n            osc.connect(g); g.connect(audioCtx.destination);\n            osc.start(now);\n            osc.stop(now + 3.2);\n            chargingOsc = osc;\n            chargingGain = g;\n        } catch (_) {}\n    }\n    function stopChargingTone(silent) {\n        try {\n            if (chargingGain && audioCtx) {\n                const now = audioCtx.currentTime;\n                chargingGain.gain.cancelScheduledValues(now);\n                chargingGain.gain.setValueAtTime(chargingGain.gain.value, now);\n                chargingGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);\n            }\n            if (chargingOsc) {\n                try { chargingOsc.stop(audioCtx.currentTime + 0.1); } catch (_) {}\n            }\n        } catch (_) {}\n        chargingOsc = null;\n        chargingGain = null;\n    }\n\n    let pulseInt = null;\n    let unsub = null;\n    let finalized = false;\n    let aliveCheckInt = null;\n    let isHolding = false;\n\n    function setCounter(active) {\n        if (finalized) return;\n        const shown = Math.min(active, TARGET);\n        counterEl.firstChild.nodeValue = String(shown);\n        counterEl.classList.toggle('active', shown >= 1);\n        counterEl.classList.toggle('warm',   shown >= TARGET * 0.5 && shown \u003c TARGET * 0.8);\n        counterEl.classList.toggle('hot',    shown >= TARGET * 0.8);\n    }\n\n    // The status doc is the single source of truth — written only by the\n    // pulseBlackSun Cloud Function after applying account-age / hold-duration\n    // / IP-cap heuristics. Players can't fake it (rules deny client writes).\n    function startListener() {\n        if (unsub) return;\n        if (typeof GameAPI.watchDoc !== 'function') {\n            console.error('[blacksun_protocol] GameAPI.watchDoc not available — runtime is too old');\n            hint.textContent = 'RUNTIME OUTDATED';\n            return;\n        }\n        unsub = GameAPI.watchDoc('black_sun_nodes_status/main', (data) => {\n            if (!data) { setCounter(0); return; }\n            if (typeof data.count === 'number') setCounter(data.count);\n            if (data.unlocked && !finalized) finalize();\n        });\n    }\n\n    async function sendHeartbeat() {\n        if (typeof GameAPI.callFunction !== 'function') return;\n        try {\n            const data = await GameAPI.callFunction('pulseBlackSun', {});\n            if (data && typeof data.count === 'number') setCounter(data.count);\n            if (data && data.unlocked && !finalized) finalize();\n        } catch (err) {\n            console.error('[blacksun_protocol] pulse failed', err);\n            hint.textContent = 'WRITE: ' + (err && err.code || err && err.message || err);\n        }\n    }\n\n    // Tell the server we let go. Server zeros our heartbeat doc so we drop\n    // out of the count on the next holder's pulse — without this, FRESH_MS\n    // (2.5s) keeps us counted post-release, defeating simultaneity.\n    function sendRelease() {\n        if (typeof GameAPI.callFunction !== 'function') return;\n        try { GameAPI.callFunction('pulseBlackSun', { release: true }); } catch (_) {}\n    }\n\n    function startPulse() {\n        if (finalized) return;\n        isHolding = true;\n        SFX.click();\n        startChargingTone();\n        holdBtn.classList.add('holding');\n        progress.classList.remove('complete');\n        // RAF nudge so the transition restart is reliable when re-pressing fast.\n        requestAnimationFrame(() => progress.classList.add('charging'));\n        if (chargedTimer) clearTimeout(chargedTimer);\n        chargedTimer = setTimeout(() => {\n            if (holdBtn.classList.contains('holding') && !finalized) {\n                progress.classList.add('complete');\n                SFX.charged();\n                // Ring just hit full at MIN_HOLD_MS. Fire an immediate heartbeat\n                // so the server's count ticks up the moment the bar fills,\n                // instead of waiting for the next interval tick (which would\n                // otherwise add ~1.5s of dead time after visual completion).\n                sendHeartbeat();\n            }\n        }, 3000);\n        hint.textContent = 'מחובר';\n        startListener();\n        sendHeartbeat();\n        if (pulseInt) clearInterval(pulseInt);\n        pulseInt = setInterval(sendHeartbeat, 1500);\n    }\n\n    function stopPulse() {\n        const wasHolding = isHolding;\n        isHolding = false;\n        holdBtn.classList.remove('holding');\n        stopChargingTone();\n        if (!finalized) {\n            progress.classList.remove('charging', 'complete');\n            if (chargedTimer) { clearTimeout(chargedTimer); chargedTimer = null; }\n        }\n        if (pulseInt) { clearInterval(pulseInt); pulseInt = null; }\n        // Explicit release call — see sendRelease() comment. wasHolding gates\n        // re-entry from the multi-listener fanout (mouseup + mouseleave on the\n        // same gesture would otherwise double-fire).\n        if (wasHolding && !finalized) sendRelease();\n        if (!finalized) hint.textContent = 'החזק';\n    }\n\n    function finalize() {\n        if (finalized) return;\n        finalized = true;\n        if (pulseInt) { clearInterval(pulseInt); pulseInt = null; }\n        if (chargedTimer) { clearTimeout(chargedTimer); chargedTimer = null; }\n        stopChargingTone();\n        progress.classList.remove('charging');\n        progress.classList.add('complete');\n        stage.classList.add('success');\n        counterEl.firstChild.nodeValue = String(TARGET);\n        hint.textContent = 'מאומת';\n\n        setTimeout(() => {\n            SFX.success();\n            if (params.successSound) { try { GameAPI.playSound(params.successSound); } catch (_) {} }\n            if (params.successFlag) { try { GameAPI.setFlag(params.successFlag); } catch (_) {} }\n            // Note: the global unlock flag is now written server-side by the\n            // pulseBlackSun Cloud Function. We do NOT call GameAPI.triggerGlobal\n            // here — that would be an unauthenticated write the player could fake.\n        }, Math.min(400, PAUSE_MS / 2));\n\n        setTimeout(async () => {\n            const room = (params.successRoom || '').trim();\n            try {\n                if (room) {\n                    if (successFade && GameAPI.fadeToBlack) await GameAPI.fadeToBlack(800);\n                    GameAPI.goToRoom(room);\n                } else if (closeOnSuccess) {\n                    GameAPI.close();\n                }\n            } catch (_) {}\n        }, PAUSE_MS + 700);\n    }\n\n    function cleanup() {\n        // If the prefab is closed mid-hold (back-hotspot, fade transition,\n        // tab-close before unload fires), best-effort tell the server we let go.\n        if (isHolding && !finalized) sendRelease();\n        isHolding = false;\n        stopChargingTone();\n        if (pulseInt) { clearInterval(pulseInt); pulseInt = null; }\n        if (unsub) { try { unsub(); } catch (_) {} unsub = null; }\n        if (aliveCheckInt) { clearInterval(aliveCheckInt); aliveCheckInt = null; }\n        if (chargedTimer) { clearTimeout(chargedTimer); chargedTimer = null; }\n    }\n\n    holdBtn.addEventListener('mousedown',   e => { e.preventDefault(); startPulse(); });\n    holdBtn.addEventListener('mouseup',     stopPulse);\n    holdBtn.addEventListener('mouseleave',  stopPulse);\n    holdBtn.addEventListener('touchstart',  e => { e.preventDefault(); startPulse(); }, { passive: false });\n    holdBtn.addEventListener('touchend',    stopPulse);\n    holdBtn.addEventListener('touchcancel', stopPulse);\n    holdBtn.addEventListener('contextmenu', e => e.preventDefault());\n\n    // Subscribe to the count even before the player holds, so they see live state.\n    startListener();\n\n    // The engine wipes prefab DOM via innerHTML on close; detect that and clean up.\n    aliveCheckInt = setInterval(() => {\n        if (!document.body.contains(holdBtn)) cleanup();\n    }, 1000);\n\n    window.addEventListener('beforeunload', cleanup);\n})();\n\u003c/script>\n",
