                    "html": "\u003cstyle>\n    /* Canvas runs at 256×144 internal; CSS scales it with image-rendering:pixelated\n       so every drawn pixel is a chunky on-screen block. All overlays sit on top\n       and share the same NES-ish 4-color block aesthetic. */\n    .srunner-wrap {\n        height: 100%;\n        width: 100%;\n        display: flex;\n        align-items: center;\n        justify-content: center;\n        font-family: 'Courier New', 'Lucida Console', monospace;\n        user-select: none;\n        -webkit-user-select: none;\n    }\n\n    .srunner-frame {\n        background: #060814;\n        border: 4px solid #1a2040;\n        border-radius: 0;\n        padding: 12px;\n        box-shadow:\n            0 0 0 2px #0d0e1f inset,\n            0 0 0 4px #2a3258,\n            0 14px 38px rgba(0,0,0,0.8);\n        max-width: min(95vw, 768px);\n        width: 100%;\n        position: relative;\n    }\n\n    .srunner-canvas-host {\n        position: relative;\n        background: #0d0e1f;\n        border: 2px solid #1a2040;\n        overflow: hidden;\n        aspect-ratio: 16 / 9;\n    }\n\n    #srunner-canvas {\n        display: block;\n        width: 100%;\n        height: 100%;\n        image-rendering: pixelated;\n        image-rendering: crisp-edges;\n        -ms-interpolation-mode: nearest-neighbor;\n    }\n\n    /* Scanline overlay — barely-visible horizontal stripes for CRT feel.\n       Pointer-events:none so it never eats clicks. */\n    .srunner-scanlines {\n        position: absolute;\n        inset: 0;\n        background: repeating-linear-gradient(\n            to bottom,\n            rgba(0,0,0,0) 0,\n            rgba(0,0,0,0) 2px,\n            rgba(0,0,0,0.18) 3px,\n            rgba(0,0,0,0) 4px\n        );\n        pointer-events: none;\n        z-index: 5;\n    }\n\n    /* Subtle vignette for depth. */\n    .srunner-vignette {\n        position: absolute;\n        inset: 0;\n        background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.55) 100%);\n        pointer-events: none;\n        z-index: 4;\n    }\n\n    /* All overlays share this layout. .hidden gates display.\n       Z-index above scanlines so UI text isn't sliced. */\n    .srunner-overlay {\n        position: absolute;\n        inset: 0;\n        display: flex;\n        flex-direction: column;\n        align-items: center;\n        justify-content: center;\n        gap: 14px;\n        padding: 16px;\n        text-align: center;\n        z-index: 10;\n        background: rgba(13, 14, 31, 0.78);\n    }\n\n    .srunner-overlay.hidden {\n        display: none;\n    }\n\n    /* Title/menu specific */\n    .srunner-overlay .title {\n        font-size: clamp(1.8rem, 5.5vw, 2.8rem);\n        letter-spacing: 2px;\n        color: #ffd668;\n        text-shadow:\n            3px 3px 0 #ff7028,\n            6px 6px 0 #1a2040;\n        font-weight: 900;\n        font-family: 'Courier New', 'Lucida Console', monospace;\n    }\n\n    .srunner-overlay .subtitle {\n        font-size: clamp(0.7rem, 1.6vw, 0.9rem);\n        letter-spacing: 4px;\n        color: #6ed4ff;\n        margin-top: -6px;\n        font-weight: bold;\n    }\n\n    .srunner-overlay .big-text {\n        font-size: clamp(1.4rem, 4vw, 2rem);\n        letter-spacing: 2px;\n        color: #ff7028;\n        text-shadow: 2px 2px 0 #1a2040;\n        font-weight: 900;\n    }\n\n    .srunner-overlay .score-line {\n        font-size: clamp(0.85rem, 2vw, 1.1rem);\n        letter-spacing: 3px;\n        color: #f8f8f8;\n        font-weight: bold;\n    }\n    .srunner-overlay .score-line .v {\n        color: #ffd668;\n        margin-inline-start: 6px;\n        font-size: 1.1em;\n    }\n\n    .srunner-overlay .best-line {\n        font-size: clamp(0.7rem, 1.5vw, 0.85rem);\n        letter-spacing: 2px;\n        color: #6ed4ff;\n    }\n\n    .srunner-overlay .prompt {\n        font-size: clamp(0.7rem, 1.5vw, 0.85rem);\n        letter-spacing: 2px;\n        color: #b8c1e8;\n    }\n\n    .srunner-overlay .hint {\n        font-size: clamp(0.6rem, 1.2vw, 0.7rem);\n        letter-spacing: 3px;\n        color: #5a6694;\n        margin-top: 6px;\n    }\n\n    .srunner-overlay .hint.flash {\n        animation: srPulse 1s ease-in-out infinite;\n    }\n\n    @keyframes srPulse {\n        0%, 100% { opacity: 1; }\n        50% { opacity: 0.35; }\n    }\n\n    /* Menu items — pixel-block list with selector arrow */\n    .srunner-menu-list {\n        list-style: none;\n        margin: 0;\n        padding: 0;\n        display: flex;\n        flex-direction: column;\n        gap: 4px;\n        min-width: 60%;\n    }\n\n    .srunner-menu-item {\n        font-size: clamp(0.9rem, 2.2vw, 1.15rem);\n        letter-spacing: 2px;\n        color: #98a3d8;\n        padding: 6px 28px;\n        cursor: pointer;\n        position: relative;\n        transition: color 0.1s linear;\n        font-weight: bold;\n    }\n\n    .srunner-menu-item.selected {\n        color: #ffd668;\n        text-shadow: 2px 2px 0 #1a2040;\n    }\n\n    /* Selector marker — sits on the start-edge of the item in whatever\n       direction the parent uses (RTL puts it on the right of the LTR\n       reading order = right side of the screen for Hebrew). */\n    .srunner-menu-item.selected::before {\n        content: '◆';\n        position: absolute;\n        inset-inline-start: 6px;\n        top: 50%;\n        transform: translateY(-50%);\n        color: #ff7028;\n        font-size: 0.7em;\n        animation: srBlink 0.8s steps(2) infinite;\n    }\n\n    @keyframes srBlink {\n        50% { opacity: 0; }\n    }\n\n    /* Name input — chunky 6-cell-style text input */\n    #srunner-name-input {\n        width: 70%;\n        max-width: 200px;\n        padding: 10px 8px;\n        background: #0d0e1f;\n        border: 2px solid #6ed4ff;\n        border-radius: 0;\n        color: #ffd668;\n        font-family: 'Courier New', 'Lucida Console', monospace;\n        font-size: clamp(1.2rem, 3vw, 1.6rem);\n        letter-spacing: 8px;\n        text-align: center;\n        text-transform: uppercase;\n        outline: none;\n        font-weight: 900;\n        box-shadow: 0 0 0 4px #1a2040;\n    }\n\n    #srunner-name-input:focus {\n        border-color: #ffd668;\n        box-shadow: 0 0 0 4px #ff7028;\n    }\n\n    /* Pixel-style buttons */\n    .srunner-btn-row {\n        display: flex;\n        gap: 12px;\n        justify-content: center;\n        flex-wrap: wrap;\n    }\n\n    .srunner-btn {\n        background: #1a2040;\n        border: 2px solid #2a3258;\n        color: #d8e2ff;\n        padding: 8px 18px;\n        font-family: 'Courier New', 'Lucida Console', monospace;\n        font-size: 0.85rem;\n        letter-spacing: 3px;\n        cursor: pointer;\n        font-weight: bold;\n        transition: all 0.1s linear;\n        box-shadow: 2px 2px 0 #060814;\n    }\n\n    .srunner-btn.primary {\n        background: #ff7028;\n        border-color: #ffd668;\n        color: #0d0e1f;\n    }\n\n    .srunner-btn:hover:not(:disabled) {\n        transform: translate(-1px, -1px);\n        box-shadow: 3px 3px 0 #060814;\n    }\n\n    .srunner-btn:active:not(:disabled) {\n        transform: translate(1px, 1px);\n        box-shadow: 1px 1px 0 #060814;\n    }\n\n    .srunner-btn:disabled {\n        opacity: 0.4;\n        cursor: not-allowed;\n    }\n\n    .srunner-name-error {\n        font-size: 0.75rem;\n        color: #ff6060;\n        min-height: 14px;\n        letter-spacing: 1px;\n    }\n\n    /* Leaderboard — pixel-block rows */\n    .srunner-lb-list {\n        list-style: none;\n        margin: 0;\n        padding: 0;\n        display: flex;\n        flex-direction: column;\n        gap: 3px;\n        min-width: 75%;\n        max-width: 380px;\n    }\n\n    .srunner-lb-list li {\n        display: grid;\n        grid-template-columns: 28px 1fr auto;\n        gap: 8px;\n        align-items: center;\n        padding: 5px 10px;\n        background: rgba(40, 50, 90, 0.4);\n        border: 2px solid transparent;\n        font-size: clamp(0.75rem, 1.7vw, 0.9rem);\n        letter-spacing: 2px;\n    }\n\n    .srunner-lb-list li.you {\n        background: rgba(255, 112, 40, 0.25);\n        border-color: #ffd668;\n        animation: srBlink 0.6s steps(2) infinite;\n    }\n\n    .srunner-lb-list li .rank {\n        color: #ff7028;\n        font-weight: 900;\n        text-align: center;\n    }\n\n    .srunner-lb-list li .name {\n        color: #f8f8f8;\n        text-transform: uppercase;\n        overflow: hidden;\n        text-overflow: clip;\n        white-space: nowrap;\n    }\n\n    .srunner-lb-list li .score {\n        color: #ffd668;\n        font-variant-numeric: tabular-nums;\n        font-weight: 900;\n    }\n\n    .srunner-lb-list li.empty {\n        text-align: center;\n        color: #5a6694;\n        background: transparent;\n        grid-template-columns: 1fr;\n        font-size: 0.8rem;\n    }\n\n    /* In-run HUD — score (right) + best (left). HTML overlay rather than\n       canvas so Hebrew labels render with native font, while the score number\n       still feels chunky thanks to letter-spacing + heavy weight + black drop\n       shadow. Pointer-events:none so it never eats hold-to-rise input. */\n    .srunner-hud {\n        position: absolute;\n        top: 4px;\n        left: 0;\n        right: 0;\n        display: flex;\n        justify-content: space-between;\n        padding: 0 8px;\n        pointer-events: none;\n        z-index: 7;\n        font-family: 'Courier New', 'Lucida Console', monospace;\n        font-weight: 900;\n    }\n    .srunner-hud.hidden { display: none; }\n\n    .srunner-hud .hud-best,\n    .srunner-hud .hud-score {\n        display: flex;\n        align-items: baseline;\n        gap: 4px;\n        line-height: 1;\n        text-shadow: 2px 2px 0 #0d0e1f;\n    }\n    .srunner-hud .hud-label {\n        font-size: 0.7rem;\n        letter-spacing: 2px;\n        color: #6ed4ff;\n    }\n    .srunner-hud .hud-best .hud-value {\n        font-size: 0.85rem;\n        letter-spacing: 2px;\n        color: #6ed4ff;\n        font-variant-numeric: tabular-nums;\n    }\n    .srunner-hud .hud-score .hud-label {\n        color: #ffd668;\n    }\n    .srunner-hud .hud-score .hud-value {\n        font-size: 1.05rem;\n        letter-spacing: 3px;\n        color: #ffd668;\n        font-variant-numeric: tabular-nums;\n        text-shadow: 2px 2px 0 #0d0e1f, 0 0 6px rgba(255,214,104,0.4);\n    }\n\n    /* Milestone line — subtle persistent text under the canvas. Reward strings\n       are fetched from claimStarRunnerMilestone (one per 1000-point tier) so\n       they never ship to the client up front; current string replaces prior on\n       crossing. Z-index 7 so menu/gameover overlays (z-10) hide it without\n       manual cleanup. */\n    .srunner-milestone {\n        position: absolute;\n        bottom: 6px;\n        left: 50%;\n        transform: translateX(-50%);\n        z-index: 7;\n        font-family: 'Courier New', 'Lucida Console', monospace;\n        font-size: 0.78rem;\n        letter-spacing: 1px;\n        color: #ffd668;\n        background: rgba(13, 14, 31, 0.55);\n        padding: 3px 10px;\n        text-shadow: 1px 1px 0 #1a2040;\n        pointer-events: none;\n        opacity: 0;\n        transition: opacity 0.6s ease;\n        max-width: 86%;\n        text-align: center;\n        direction: rtl;\n        white-space: nowrap;\n        overflow: hidden;\n        text-overflow: ellipsis;\n    }\n    .srunner-milestone.show { opacity: 0.85; }\n\n    /* In-run tutorial hint — pulses at top during first few seconds of every\n       run so the controls stay discoverable. Pointer-events:none so it never\n       intercepts the hold-to-rise input. */\n    .srunner-tutorial {\n        position: absolute;\n        top: 22%;\n        left: 50%;\n        transform: translateX(-50%);\n        z-index: 7;\n        font-family: 'Courier New', monospace;\n        font-size: clamp(0.7rem, 1.6vw, 0.9rem);\n        letter-spacing: 3px;\n        color: #ffd668;\n        text-shadow: 2px 2px 0 #1a2040, 0 0 6px rgba(255, 214, 104, 0.5);\n        pointer-events: none;\n        text-align: center;\n        white-space: nowrap;\n        font-weight: bold;\n        animation: srTutorial 0.9s ease-in-out infinite;\n    }\n    .srunner-tutorial.gone {\n        display: none;\n    }\n    @keyframes srTutorial {\n        0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }\n        50% { opacity: 1; transform: translateX(-50%) scale(1.06); }\n    }\n\n    /* Death flash — momentary screen-wide flash */\n    .srunner-flash {\n        position: absolute;\n        inset: 0;\n        background: #f8f8f8;\n        opacity: 0;\n        pointer-events: none;\n        z-index: 6;\n    }\n\n    .srunner-flash.fire {\n        animation: srFlash 0.18s ease-out;\n    }\n\n    @keyframes srFlash {\n        0% { opacity: 0.9; }\n        100% { opacity: 0; }\n    }\n\u003c/style>\n\n\u003cdiv class=\"srunner-wrap\">\n    \u003cdiv class=\"srunner-frame\">\n        \u003cdiv class=\"srunner-canvas-host\" id=\"srunner-host\" tabindex=\"0\">\n            \u003ccanvas id=\"srunner-canvas\" width=\"256\" height=\"144\">\u003c/canvas>\n            \u003cdiv class=\"srunner-scanlines\">\u003c/div>\n            \u003cdiv class=\"srunner-vignette\">\u003c/div>\n            \u003cdiv class=\"srunner-flash\" id=\"srunner-flash\">\u003c/div>\n            \u003cdiv class=\"srunner-hud hidden\" id=\"srunner-hud\" dir=\"rtl\">\n                \u003cdiv class=\"hud-best\">\u003cspan class=\"hud-label\">שיא\u003c/span>\u003cspan class=\"hud-value\" id=\"hud-best-val\">00000\u003c/span>\u003c/div>\n                \u003cdiv class=\"hud-score\">\u003cspan class=\"hud-label\">ניקוד\u003c/span>\u003cspan class=\"hud-value\" id=\"hud-score-val\">00000\u003c/span>\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"srunner-tutorial gone\" id=\"srunner-tutorial\">החזק עכבר / רווח כדי לעלות\u003c/div>\n            \u003cdiv class=\"srunner-milestone\" id=\"srunner-milestone\">\u003c/div>\n\n            \u003c!-- MENU -->\n            \u003cdiv class=\"srunner-overlay\" id=\"srunner-menu\" dir=\"rtl\">\n                \u003cdiv class=\"title\">כוכב נופל\u003c/div>\n                \u003cul class=\"srunner-menu-list\" id=\"srunner-menu-list\">\n                    \u003cli class=\"srunner-menu-item selected\" data-action=\"play\">התחל\u003c/li>\n                    \u003cli class=\"srunner-menu-item\" data-action=\"scores\">שיאים\u003c/li>\n                \u003c/ul>\n                \u003cdiv class=\"hint flash\">↑ ↓ • W S • ENTER\u003c/div>\n            \u003c/div>\n\n            \u003c!-- GAME OVER (no submission needed) -->\n            \u003cdiv class=\"srunner-overlay hidden\" id=\"srunner-gameover\" dir=\"rtl\">\n                \u003cdiv class=\"big-text\">המשחק נגמר\u003c/div>\n                \u003cdiv class=\"score-line\">ניקוד \u003cspan class=\"v\" id=\"go-score\">0\u003c/span>\u003c/div>\n                \u003cdiv class=\"best-line\" id=\"go-best\">\u003c/div>\n                \u003cdiv class=\"hint flash\" id=\"go-hint\">ENTER לחזרה לתפריט\u003c/div>\n            \u003c/div>\n\n            \u003c!-- NAME ENTRY -->\n            \u003cdiv class=\"srunner-overlay hidden\" id=\"srunner-name\" dir=\"rtl\">\n                \u003cdiv class=\"big-text\">ניקוד חדש\u003c/div>\n                \u003cdiv class=\"score-line\">\u003cspan class=\"v\" id=\"name-score\">0\u003c/span>\u003c/div>\n                \u003cdiv class=\"prompt\">הכנס שם (עד 6 תווים)\u003c/div>\n                \u003cinput id=\"srunner-name-input\" maxlength=\"6\" autocomplete=\"off\" spellcheck=\"false\" />\n                \u003cdiv class=\"srunner-btn-row\">\n                    \u003cbutton class=\"srunner-btn\" data-action=\"skip\">דלג\u003c/button>\n                    \u003cbutton class=\"srunner-btn primary\" data-action=\"submit\">שלח\u003c/button>\n                \u003c/div>\n                \u003cdiv class=\"srunner-name-error\" id=\"srunner-name-error\">\u003c/div>\n            \u003c/div>\n\n            \u003c!-- LEADERBOARD -->\n            \u003cdiv class=\"srunner-overlay hidden\" id=\"srunner-lb\" dir=\"rtl\">\n                \u003cdiv class=\"big-text\" id=\"lb-title\">לוח שיאים\u003c/div>\n                \u003cdiv id=\"srunner-lb-demo-banner\" style=\"display:none; color:#ff7028; font-size:0.85rem; margin-bottom:6px; text-shadow: 1px 1px 0 #1a2040;\">⚠ מצב בדיקה — שיאים אינם מסונכרנים\u003c/div>\n                \u003col class=\"srunner-lb-list\" id=\"srunner-lb-list\">\n                    \u003cli class=\"empty\">טוען...\u003c/li>\n                \u003c/ol>\n                \u003cdiv class=\"hint flash\">לחץ לחזרה\u003c/div>\n            \u003c/div>\n        \u003c/div>\n    \u003c/div>\n\u003c/div>\n\n\u003cscript type=\"application/json\" id=\"prefab-params\">\n{\n    \"minScore\": { \"type\": \"number\", \"label\": \"ניקוד מינימלי כדי להירשם בלוח\", \"default\": 100 },\n    \"topN\": { \"type\": \"number\", \"label\": \"כמה ערכים להציג בלוח\", \"default\": 6 },\n    \"shiftThreshold\": { \"type\": \"number\", \"label\": \"סף שינוי רקע (שמיים → חלל)\", \"default\": 800 },\n    \"voidThreshold\": { \"type\": \"number\", \"label\": \"סף חלל עמוק (חלל → תהום)\", \"default\": 2500 }\n}\n\u003c/script>\n\n\u003cscript>\n(function() {\n    // Shadow GameAPI with a safe stub. When the prefab is opened directly\n    // (file://, no engine), `GameAPI` is an undeclared identifier and any\n    // `GameAPI.foo` reference throws ReferenceError mid-script — which would\n    // abort everything declared after, including the keyboard/pointer\n    // listeners. Snapshotting once here keeps the rest of the script safe.\n    const GameAPI = window.GameAPI || {};\n    const params = GameAPI.params || {};\n    const MIN_SCORE = Math.max(1, parseInt(params.minScore, 10) || 100);\n    const TOP_N = Math.max(1, Math.min(20, parseInt(params.topN, 10) || 6));\n    const SHIFT_THRESHOLD = Math.max(1, parseInt(params.shiftThreshold, 10) || 800);\n    const VOID_THRESHOLD = Math.max(SHIFT_THRESHOLD + 100, parseInt(params.voidThreshold, 10) || 2500);\n    const SCOREBOARD_PATH = 'star_runner_scoreboard/main';\n\n    // ---- DOM ----\n    const canvas = document.getElementById('srunner-canvas');\n    const ctx = canvas.getContext('2d');\n    ctx.imageSmoothingEnabled = false;\n    const W = canvas.width;   // 256\n    const H = canvas.height;  // 144\n    const host = document.getElementById('srunner-host');\n    const flashEl = document.getElementById('srunner-flash');\n    const menuEl = document.getElementById('srunner-menu');\n    const gameoverEl = document.getElementById('srunner-gameover');\n    const nameEl = document.getElementById('srunner-name');\n    const lbEl = document.getElementById('srunner-lb');\n    const lbList = document.getElementById('srunner-lb-list');\n    const lbTitle = document.getElementById('lb-title');\n    const goScore = document.getElementById('go-score');\n    const goBest = document.getElementById('go-best');\n    const goHint = document.getElementById('go-hint');\n    const nameScore = document.getElementById('name-score');\n    const nameInput = document.getElementById('srunner-name-input');\n    const nameError = document.getElementById('srunner-name-error');\n    const hudEl = document.getElementById('srunner-hud');\n    const hudScoreVal = document.getElementById('hud-score-val');\n    const hudBestVal = document.getElementById('hud-best-val');\n    const milestoneEl = document.getElementById('srunner-milestone');\n    // Milestone reveals are server-validated. On each 1000-point crossing\n    // during a real run we ask claimStarRunnerMilestone for the tier's string;\n    // codes never ship to the client. revealedMilestones caches successful\n    // responses so a flaky network on a re-cross doesn't reissue requests.\n    const revealedMilestones = new Map();\n    const milestoneClaimsInFlight = new Set();\n\n    // ---- 5×7 PIXEL FONT (canvas-rendered) ----\n    // '1' = filled, '0' = empty. Rows = 7. Width = 5. Each glyph rendered\n    // by iterating cells and fillRect-ing the lit ones.\n    const FONT = {\n        '0':['01110','10001','10011','10101','11001','10001','01110'],\n        '1':['00100','01100','00100','00100','00100','00100','01110'],\n        '2':['01110','10001','00001','00010','00100','01000','11111'],\n        '3':['11110','00001','00001','01110','00001','00001','11110'],\n        '4':['00010','00110','01010','10010','11111','00010','00010'],\n        '5':['11111','10000','11110','00001','00001','10001','01110'],\n        '6':['00110','01000','10000','11110','10001','10001','01110'],\n        '7':['11111','00001','00010','00100','01000','01000','01000'],\n        '8':['01110','10001','10001','01110','10001','10001','01110'],\n        '9':['01110','10001','10001','01111','00001','00010','01100'],\n        'A':['01110','10001','10001','11111','10001','10001','10001'],\n        'B':['11110','10001','10001','11110','10001','10001','11110'],\n        'C':['01110','10001','10000','10000','10000','10001','01110'],\n        'D':['11110','10001','10001','10001','10001','10001','11110'],\n        'E':['11111','10000','10000','11110','10000','10000','11111'],\n        'F':['11111','10000','10000','11110','10000','10000','10000'],\n        'G':['01110','10001','10000','10111','10001','10001','01110'],\n        'H':['10001','10001','10001','11111','10001','10001','10001'],\n        'I':['01110','00100','00100','00100','00100','00100','01110'],\n        'J':['00111','00010','00010','00010','00010','10010','01100'],\n        'K':['10001','10010','10100','11000','10100','10010','10001'],\n        'L':['10000','10000','10000','10000','10000','10000','11111'],\n        'M':['10001','11011','10101','10101','10001','10001','10001'],\n        'N':['10001','11001','10101','10011','10001','10001','10001'],\n        'O':['01110','10001','10001','10001','10001','10001','01110'],\n        'P':['11110','10001','10001','11110','10000','10000','10000'],\n        'Q':['01110','10001','10001','10001','10101','10010','01101'],\n        'R':['11110','10001','10001','11110','10100','10010','10001'],\n        'S':['01111','10000','10000','01110','00001','00001','11110'],\n        'T':['11111','00100','00100','00100','00100','00100','00100'],\n        'U':['10001','10001','10001','10001','10001','10001','01110'],\n        'V':['10001','10001','10001','10001','10001','01010','00100'],\n        'W':['10001','10001','10001','10101','10101','10101','01010'],\n        'X':['10001','10001','01010','00100','01010','10001','10001'],\n        'Y':['10001','10001','10001','01010','00100','00100','00100'],\n        'Z':['11111','00001','00010','00100','01000','10000','11111'],\n        ':':['00000','00100','00000','00000','00000','00100','00000'],\n        '.':['00000','00000','00000','00000','00000','00000','00100'],\n        '-':['00000','00000','00000','01110','00000','00000','00000'],\n        ' ':['00000','00000','00000','00000','00000','00000','00000']\n    };\n    const FONT_W = 5, FONT_H = 7;\n\n    function drawPixelText(text, x, y, color, scale) {\n        scale = scale || 1;\n        const upper = String(text).toUpperCase();\n        ctx.fillStyle = color;\n        let cx = x;\n        for (const ch of upper) {\n            const glyph = FONT[ch] || FONT[' '];\n            for (let r = 0; r \u003c FONT_H; r++) {\n                const row = glyph[r];\n                for (let c = 0; c \u003c FONT_W; c++) {\n                    if (row[c] === '1') {\n                        ctx.fillRect(cx + c * scale, y + r * scale, scale, scale);\n                    }\n                }\n            }\n            cx += (FONT_W + 1) * scale;\n        }\n    }\n\n    function pixelTextWidth(text, scale) {\n        scale = scale || 1;\n        return text.length * (FONT_W + 1) * scale - scale;\n    }\n\n    // ---- SPRITE DEFINITIONS (pixel grids, '.'=transparent, '0'+ = palette index) ----\n    // Star sprite — 7×7 diamond with bright core.\n    const STAR7 = [\n        '...0...',\n        '..010..',\n        '.01210.',\n        '0122210',\n        '.01210.',\n        '..010..',\n        '...0...'\n    ];\n    const STAR_COLORS = ['#ff7028', '#ffd668', '#fffde0'];\n\n    // Foreground obstacle cloud — 33×12, multi-lobed top + flat bottom for\n    // a recognizable cumulus silhouette. Five brightness levels with a\n    // distinct dark outline (0) so the cloud reads against any sky band.\n    // 0=outline (dark), 1=mid-grey, 2=light, 3=highlight, 4=core.\n    const CLOUD28 = [\n        '..........0000......0000.........',\n        '........00111100..00111100.......',\n        '......0011222110001112222110.....',\n        '.....011223333210112233333210....',\n        '....0112233334221112233333322110.',\n        '...01122333334432223333333333210.',\n        '...01233333344443333333333333210.',\n        '...01122333334433322333333322110.',\n        '....001122223333322222233322110..',\n        '.....00111122222222222222110000..',\n        '......0000111111111111100000.....',\n        '.........0000000000000000........'\n    ];\n    // Variant B — asymmetric thunderhead (tall left, trailing tail right).\n    const CLOUD28_B = [\n        '.................................',\n        '........0000000..................',\n        '......00111111100................',\n        '.....0111222221110000000.........',\n        '....0112233333221111111100.......',\n        '....011233444332222222211100.....',\n        '....0112334443323333333221110....',\n        '....0112233333233344433332210....',\n        '.....0111222222233333333433210...',\n        '......00111111112222222232210....',\n        '........00000001111111111100.....',\n        '...............00000000000.......'\n    ];\n    // Variant C — long flat stratus with three merged humps along the top.\n    const CLOUD28_C = [\n        '..............00000..............',\n        '.............0111110.............',\n        '....0000000.012222210.0000000....',\n        '...011222110122333221011222110...',\n        '..01223332211233433211223332210..',\n        '..01233433211223332211233433210..',\n        '..01223332211222222211223332210..',\n        '...011222222333333333222222110...',\n        '..01111222333344444333322211110..',\n        '...011112222333333333222211110...',\n        '....0011111112222222111111100....',\n        '......000000000000000000000......'\n    ];\n    const CLOUD_VARIANTS = [CLOUD28, CLOUD28_B, CLOUD28_C];\n    // 5-tone palettes — index 0 is a strong dark outline so the cloud\n    // silhouette stays legible against ANY sky band; indexes 1-4 step toward\n    // a bright core. Day = bluish-white storm cloud. Space = purple nebula\n    // wisp. Void = even dimmer purple-grey.\n    const CLOUD_COLORS_DAY = ['#1a2840', '#5878a0', '#a8c0e0', '#e8f0fc', '#ffffff'];\n    const CLOUD_COLORS_SPACE = ['#0a0418', '#3a1c60', '#6840a0', '#a878d8', '#d8b8f0'];\n    const CLOUD_COLORS_VOID = ['#040208', '#1a0a30', '#382060', '#583890', '#785cb0'];\n\n    // Decorative wispy cloudlets for the near-parallax layer — kept small\n    // (8×2 / 10×2) so the depth difference between this layer and the\n    // foreground obstacle clouds (32×13) reads clearly. Several variants\n    // pre-rolled into shape sprites — drawSpriteFast does the rest.\n    const NEAR_CLOUDS = [\n        [\n            '..0011000.',\n            '.001111100'\n        ],\n        [\n            '.00110000.',\n            '0011111110'\n        ],\n        [\n            '..001100..',\n            '.00111100.'\n        ],\n        [\n            '0011100000',\n            '.001100000'\n        ]\n    ];\n\n    // Planets are generated procedurally per radius — we want the silhouette\n    // to scale with score, so a hand-bitmap doesn't fit. Each sprite is a\n    // filled circle with 4 brightness bands and a hsl-tinted palette; the\n    // saturn-style ring is drawn separately and scales with r.\n    function buildPlanetSprite(r) {\n        const size = r * 2 + 1;\n        const cx = r, cy = r;\n        const rows = [];\n        for (let py = 0; py \u003c size; py++) {\n            let row = '';\n            for (let px = 0; px \u003c size; px++) {\n                const dx = px - cx, dy = py - cy;\n                const d = Math.hypot(dx, dy);\n                if (d > r + 0.3) {\n                    row += '.';\n                } else if (d > r - 0.7) {\n                    row += '0';                 // outline\n                } else {\n                    // Highlight biased to upper-left for a \"lit-from-above\" feel.\n                    const hd = Math.hypot(dx + r * 0.45, dy + r * 0.45);\n                    if (hd \u003c r * 0.25) row += '3';\n                    else if (hd \u003c r * 0.55) row += '2';\n                    else row += '1';\n                }\n            }\n            rows.push(row);\n        }\n        return rows;\n    }\n    // Planet radii by progression level — gradually grow from 7 to 14 across\n    // the 10 score breakpoints. Bigger planets = harder dodges; collision\n    // tracks o.r so the hitbox scales too.\n    const LEVEL_PLANET_R = [7, 7, 8, 8, 9, 10, 11, 12, 13, 14];\n    const PLANET_SPRITES = {};\n    for (const r of new Set(LEVEL_PLANET_R)) PLANET_SPRITES[r] = buildPlanetSprite(r);\n\n    function drawPlanet(o) {\n        const r = o.r;\n        const sprite = PLANET_SPRITES[r];\n        const x = (o.x | 0) - r, y = (o.y | 0) - r;\n        const hue = o.hue;\n        const palette = [\n            `hsl(${hue}, 60%, 28%)`,\n            `hsl(${hue}, 70%, 50%)`,\n            `hsl(${hue}, 80%, 72%)`,\n            '#fffde0'\n        ];\n        drawSpriteFast(sprite, x, y, palette);\n        // Saturn-style ring — extends from r past the body, length scales with r.\n        const ringY = (o.y | 0);\n        const ringExt = Math.round(r * 1.55);\n        ctx.fillStyle = palette[2];\n        for (let dx = r; dx \u003c= ringExt; dx++) {\n            ctx.fillRect((o.x | 0) - dx, ringY, 1, 1);\n            ctx.fillRect((o.x | 0) + dx, ringY, 1, 1);\n        }\n        ctx.fillStyle = palette[0];\n        for (let dx = r + 1; dx \u003c= ringExt - 1; dx++) {\n            ctx.fillRect((o.x | 0) - dx, ringY + 1, 1, 1);\n            ctx.fillRect((o.x | 0) + dx, ringY + 1, 1, 1);\n        }\n    }\n\n    // Batched sprite blitter — one fillStyle change per palette entry.\n    function drawSpriteFast(grid, x, y, palette) {\n        x |= 0; y |= 0;\n        for (let p = 0; p \u003c palette.length; p++) {\n            const code = String(p);\n            ctx.fillStyle = palette[p];\n            for (let r = 0; r \u003c grid.length; r++) {\n                const row = grid[r];\n                for (let c = 0; c \u003c row.length; c++) {\n                    if (row[c] === code) ctx.fillRect(x + c, y + r, 1, 1);\n                }\n            }\n        }\n    }\n\n    // ---- TUNABLES ----\n    // Numbers are in canvas units (256×144). Curve is \"gentle 3-second\n    // warmup → steady ramp → real challenge by ~score 300\". Difficulty\n    // tightening at 200/400/600 score breakpoints (in spawnObstacle/nextGapPx).\n    const STAR_X = 50;\n    // Player star grows in 10 discrete levels driven by score. Each level\n    // adds an arm pixel and a halo dot, so visible growth is gradual but\n    // legible. Hitbox tracks armLen so the bigger you get, the harder the\n    // late-game dodges become — extra difficulty knob built into progression.\n    const LEVEL_ARM_LEN = [4, 4, 5, 5, 6, 6, 7, 7, 8, 9];\n    const LEVEL_HALO_DIST = [0, 5, 6, 6, 7, 8, 9, 10, 11, 13];\n    const SCORE_PER_LEVEL = 300;\n\n    // Build a 5-point star sprite by rasterizing a pentagram polygon (10 verts:\n    // outer point / inner valley alternating). Outer radius = r, inner radius\n    // = r * 0.45 (slightly thicker than the golden-ratio 0.382 so small sizes\n    // still read as a star). Returns { body: [[dx,dy]…], core: [[dx,dy]…] }\n    // relative to the star center. core = innermost ~45% radius (bright); body\n    // = the rest of the star polygon.\n    function buildStarSprite(r) {\n        const ri = Math.max(1, Math.round(r * 0.45));\n        const verts = [];\n        for (let i = 0; i \u003c 10; i++) {\n            const ang = -Math.PI / 2 + i * Math.PI / 5;\n            const rad = (i % 2 === 0) ? r : ri;\n            verts.push([Math.cos(ang) * rad, Math.sin(ang) * rad]);\n        }\n        const body = [], core = [];\n        for (let dy = -r - 1; dy \u003c= r + 1; dy++) {\n            for (let dx = -r - 1; dx \u003c= r + 1; dx++) {\n                let inside = false;\n                for (let i = 0, j = 9; i \u003c 10; j = i++) {\n                    const xi = verts[i][0], yi = verts[i][1];\n                    const xj = verts[j][0], yj = verts[j][1];\n                    if (((yi > dy) !== (yj > dy)) &&\n                        (dx \u003c (xj - xi) * (dy - yi) / (yj - yi) + xi)) {\n                        inside = !inside;\n                    }\n                }\n                if (inside) {\n                    const d = Math.hypot(dx, dy);\n                    if (d \u003c= r * 0.45) core.push([dx, dy]);\n                    else body.push([dx, dy]);\n                }\n            }\n        }\n        return { body, core };\n    }\n    const STAR_SPRITES = LEVEL_ARM_LEN.map(buildStarSprite);\n\n    const GRAVITY = 240;\n    const THRUST = 520;           // net upward 280 when held; falls 240 when not\n    const MAX_VY = 130;\n    const SPEED_MIN = 60;\n    const SPEED_MAX = 250;        // top end is genuinely fast\n    const ACCEL = 4.0;            // ~48s to top speed — aggressive ramp\n    const SCORE_RATE_BASE = 7;    // ~7 pts/s at base, ~30 pts/s at top — climbs feel earned\n    const STEP_DT = 1 / 120;\n    const MAX_FRAME_DT = 0.05;\n    const WARMUP_SEC = 2.5;       // 2.5s grace before first obstacle\n    const GAP_SEC_BASE = [1.0, 1.45];\n    const GAP_SEC_HARD = [0.35, 0.65];   // late-game gaps are tight — 0.35s reaction window\n    const HARD_AT_SPEED = SPEED_MAX;\n    const TUTORIAL_MAX_SEC = 5.0;\n\n    // ---- PARALLAX LAYERS ----\n    // Three distinct depths visible from the very first frame — fixes the\n    // \"flat early game\" feel. Each layer scrolls at a fraction of the\n    // foreground speed; far layers are dim, near layers bright. Layer\n    // contents adapt to bgPhase (day → space) so the parallax remains\n    // visible in both modes.\n    //\n    //   farPx  → distant horizon dots, parallax 0.10\n    //   midPx  → mid-distance specks, parallax 0.30\n    //   nearPx → wispy ambient cloud streaks (decorative, not obstacles), parallax 0.55\n    const PARALLAX_FAR_PX = 70;\n    const PARALLAX_MID_PX = 45;\n    const PARALLAX_NEAR_COUNT = 8;\n\n    // ---- STATE ----\n    // 'menu' | 'playing' | 'dying' | 'gameover' | 'name' | 'lb'\n    let state = 'menu';\n    let star = { x: STAR_X, y: H / 2, vy: 0 };\n    let speed = SPEED_MIN;\n    let distance = 0;\n    let score = 0;\n    let elapsed = 0;\n    let warmup = 0;\n    let obstacles = [];\n    let nextSpawnAtDistance = 0;\n    let holding = false;\n    let lastFrameTs = 0;\n    let dtAccumulator = 0;\n    let bgPhase = 0;\n    let bgPhaseTarget = 0;\n    let bgStars = [];      // mid layer (parallax 0.30) — fades white in day, bright in space\n    let farLayer = [];     // far layer (parallax 0.10) — single dim pixels, \"horizon\"\n    let nearLayer = [];    // near layer (parallax 0.55) — wispy decorative cloud streaks\n    let runId = null;\n    let runStartedAt = 0;\n    let lastStartRunError = null; // surfaced in UI when scores don't sync\n    let bestLocal = parseInt(localStorage.getItem('srunnerBest') || '0', 10) || 0;\n    let leaderboardEntries = [];\n    let lbWatchUnsub = null;\n    // Demo-mode local leaderboard: when no engine is present (file:// or\n    // testing), the CF can't run so we cache entries in localStorage to keep\n    // the UX coherent across reloads.\n    const DEMO_LB_KEY = 'srunnerDemoLB';\n    function loadDemoLb() {\n        try {\n            const raw = localStorage.getItem(DEMO_LB_KEY);\n            if (!raw) return [];\n            const parsed = JSON.parse(raw);\n            return Array.isArray(parsed) ? parsed : [];\n        } catch (_) { return []; }\n    }\n    function saveDemoLb(entries) {\n        try { localStorage.setItem(DEMO_LB_KEY, JSON.stringify(entries)); } catch(_) {}\n    }\n    let starLevel = 0;\n    let prevStarLevel = 0;\n    let menuIndex = 0;\n    let menuItems = Array.from(document.querySelectorAll('.srunner-menu-item'));\n    let lastSubmittedKey = null;  // {name, score, ts} — used to highlight in lb\n    let tutorialEl = document.getElementById('srunner-tutorial');\n    let tutorialActive = false;\n    let tutorialElapsed = 0;\n    let firstHoldHappened = false;\n    let debugInvincible = false;  // dev flag for screenshot capture\n\n    // ---- AUDIO ----\n    let audioCtx = null;\n    function tone(freq, type, dur, slide, vol) {\n        try {\n            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n            if (audioCtx.state === 'suspended') audioCtx.resume();\n            const osc = audioCtx.createOscillator();\n            const g = audioCtx.createGain();\n            osc.type = type;\n            osc.frequency.value = freq;\n            g.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);\n            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);\n            if (slide) osc.frequency.exponentialRampToValueAtTime(freq * slide, audioCtx.currentTime + dur);\n            osc.connect(g); g.connect(audioCtx.destination);\n            osc.start();\n            osc.stop(audioCtx.currentTime + dur);\n        } catch (_) {}\n    }\n    const SFX = {\n        nav: () => tone(440, 'square', 0.04, 1, 0.05),\n        select: () => { tone(660, 'square', 0.06, 1, 0.06); setTimeout(() => tone(880, 'square', 0.1, 1, 0.06), 50); },\n        start: () => { tone(330, 'square', 0.08, 1.5, 0.06); setTimeout(() => tone(550, 'square', 0.12, 1.4, 0.06), 80); },\n        milestone: () => tone(880, 'square', 0.08, 1.2, 0.05),\n        death: () => { tone(220, 'sawtooth', 0.18, 0.4, 0.10); setTimeout(() => tone(110, 'sawtooth', 0.32, 0.4, 0.09), 100); },\n        keyClack: () => tone(800, 'square', 0.02, 1, 0.04),\n        submit: () => { tone(523, 'square', 0.08, 1, 0.07); setTimeout(() => tone(659, 'square', 0.08, 1, 0.07), 70); setTimeout(() => tone(784, 'square', 0.18, 1, 0.07), 140); },\n        fail: () => tone(160, 'square', 0.25, 0.5, 0.06),\n        levelUp: () => { tone(660, 'square', 0.05, 1.5, 0.06); setTimeout(() => tone(990, 'square', 0.08, 1.5, 0.06), 50); }\n    };\n\n    // ---- PARALLAX LAYERS ----\n    function initParallax() {\n        bgStars = [];\n        for (let i = 0; i \u003c PARALLAX_MID_PX; i++) {\n            bgStars.push({\n                x: Math.random() * W,\n                y: Math.random() * (H - 6),\n                parallax: 0.28 + Math.random() * 0.08,\n                size: Math.random() \u003c 0.85 ? 1 : 2,\n                phase: Math.random() * 4\n            });\n        }\n        farLayer = [];\n        for (let i = 0; i \u003c PARALLAX_FAR_PX; i++) {\n            farLayer.push({\n                x: Math.random() * W,\n                y: Math.random() * H,\n                parallax: 0.08 + Math.random() * 0.04\n            });\n        }\n        nearLayer = [];\n        for (let i = 0; i \u003c PARALLAX_NEAR_COUNT; i++) {\n            nearLayer.push({\n                x: Math.random() * W,\n                y: 5 + Math.random() * (H - 25),\n                parallax: 0.45 + Math.random() * 0.18,\n                spriteIdx: Math.floor(Math.random() * NEAR_CLOUDS.length)\n            });\n        }\n    }\n    initParallax();\n\n    // ---- OBSTACLE GEN ----\n    function rand(a, b) { return a + Math.random() * (b - a); }\n\n    function difficultyT() {\n        return Math.max(0, Math.min(1, (speed - SPEED_MIN) / (HARD_AT_SPEED - SPEED_MIN)));\n    }\n    function nextGapPx() {\n        const t = difficultyT();\n        const lo = GAP_SEC_BASE[0] * (1 - t) + GAP_SEC_HARD[0] * t;\n        const hi = GAP_SEC_BASE[1] * (1 - t) + GAP_SEC_HARD[1] * t;\n        return speed * rand(lo, hi);\n    }\n\n    function spawnObstacle() {\n        // Probability of planet rises with score — early game is mostly clouds\n        // (forgiving large hitboxes) and later it's planet-heavy (tighter dodges).\n        const intScore = Math.floor(score);\n        let planetProb = 0.35;\n        if (intScore > 200) planetProb = 0.5;\n        if (intScore > 500) planetProb = 0.62;\n        const isPlanet = Math.random() \u003c planetProb;\n        if (isPlanet) {\n            const lvl = Math.min(9, Math.floor(intScore / SCORE_PER_LEVEL));\n            const r = LEVEL_PLANET_R[lvl];\n            obstacles.push({\n                kind: 'planet',\n                x: W + r + 4,\n                y: rand(r + 6, H - r - 18),\n                w: r * 2,\n                h: r * 2,\n                hue: Math.floor(rand(0, 360)),\n                r: r\n            });\n        } else {\n            obstacles.push({\n                kind: 'cloud',\n                x: W + 18,\n                y: rand(H * 0.30, H - 28),\n                w: 28,\n                h: 10,\n                variant: Math.floor(Math.random() * CLOUD_VARIANTS.length)\n            });\n        }\n    }\n\n    // ---- COLLISION ----\n    function collides() {\n        const HITBOX_SHRINK = 0.65;\n        const sr = LEVEL_ARM_LEN[starLevel];\n        const sx0 = star.x - sr, sx1 = star.x + sr;\n        const sy0 = star.y - sr, sy1 = star.y + sr;\n        for (const o of obstacles) {\n            const ow = o.w * HITBOX_SHRINK;\n            const oh = o.h * HITBOX_SHRINK;\n            const ox0 = o.x - ow / 2;\n            const ox1 = o.x + ow / 2;\n            const oy0 = o.y - oh / 2;\n            const oy1 = o.y + oh / 2;\n            if (sx1 > ox0 && sx0 \u003c ox1 && sy1 > oy0 && sy0 \u003c oy1) return true;\n        }\n        if (star.y - sr \u003c 0 || star.y + sr > H) return true;\n        return false;\n    }\n\n    // ---- STEP ----\n    function step(dt) {\n        if (state !== 'playing') return;\n        elapsed += dt;\n        speed = Math.min(SPEED_MAX, speed + ACCEL * dt);\n        distance += speed * dt;\n\n        let accel = GRAVITY;\n        if (holding) {\n            accel -= THRUST;\n            if (!firstHoldHappened) {\n                firstHoldHappened = true;\n                hideTutorial();\n            }\n        }\n        star.vy += accel * dt;\n        if (star.vy > MAX_VY) star.vy = MAX_VY;\n        if (star.vy \u003c -MAX_VY) star.vy = -MAX_VY;\n        star.y += star.vy * dt;\n\n        // Tutorial timeout (auto-dismiss after TUTORIAL_MAX_SEC even if the\n        // player hasn't pressed anything — keeps the screen clean).\n        if (tutorialActive) {\n            tutorialElapsed += dt;\n            if (tutorialElapsed >= TUTORIAL_MAX_SEC) hideTutorial();\n        }\n\n        const prevScore = score;\n        score += dt * SCORE_RATE_BASE * (speed / SPEED_MIN);\n        const intScore = Math.floor(score);\n        if (Math.floor(prevScore / 100) !== Math.floor(intScore / 100)) SFX.milestone();\n\n        // Each crossing of a 1000-point boundary asks the server for that\n        // tier's reward string. Demo mode (no runId) skips the request — the\n        // codes are gameplay rewards, so a no-engine open shouldn't reveal\n        // them. Cached responses (post-respawn re-cross) reuse without a\n        // round trip. Failures stay silent so a network blip doesn't break\n        // the run.\n        const prevK = Math.floor(prevScore / 1000);\n        const newK = Math.floor(intScore / 1000);\n        if (newK > prevK && newK > 0) {\n            requestMilestone(newK);\n        }\n\n        // Star stays a fixed size; difficulty growth comes from planet size\n        // (LEVEL_PLANET_R), tighter spawn gaps, and rising speed instead.\n        // Level-up cue still fires at score breakpoints so the player gets\n        // feedback that the world is escalating.\n        const planetLvl = Math.min(9, Math.floor(intScore / SCORE_PER_LEVEL));\n        const prevPlanetLvl = Math.min(9, Math.floor(prevScore / SCORE_PER_LEVEL));\n        if (planetLvl > prevPlanetLvl) SFX.levelUp && SFX.levelUp();\n\n        // Three discrete sky tiers — bgPhase ∈ [0, 2]. 0=day, 1=space,\n        // 2=deep void. Each threshold pushes the target up by 1; the lerp\n        // produces a smooth visual ramp through the transition.\n        if (intScore >= VOID_THRESHOLD) bgPhaseTarget = 2;\n        else if (intScore >= SHIFT_THRESHOLD) bgPhaseTarget = 1;\n        bgPhase += (bgPhaseTarget - bgPhase) * Math.min(1, dt * 0.4);\n\n        if (warmup \u003c WARMUP_SEC) {\n            warmup += dt;\n        } else {\n            if (distance >= nextSpawnAtDistance) {\n                spawnObstacle();\n                nextSpawnAtDistance = distance + nextGapPx();\n            }\n        }\n\n        for (const o of obstacles) o.x -= speed * dt;\n        for (let i = obstacles.length - 1; i >= 0; i--) {\n            if (obstacles[i].x + obstacles[i].w \u003c -10) obstacles.splice(i, 1);\n        }\n\n        // Parallax layers — scroll at fraction of foreground speed for depth.\n        // Near layer scrolls fastest, far layer slowest. All wrap at the left\n        // edge so the layer never \"runs out\".\n        for (const s of farLayer) {\n            s.x -= speed * dt * s.parallax;\n            if (s.x \u003c -1) { s.x = W + Math.random() * 8; s.y = Math.random() * H; }\n        }\n        for (const s of bgStars) {\n            s.x -= speed * dt * s.parallax;\n            s.phase += dt * 2;\n            if (s.x \u003c -2) { s.x = W + Math.random() * 6; s.y = Math.random() * (H - 6); }\n        }\n        for (const s of nearLayer) {\n            s.x -= speed * dt * s.parallax;\n            if (s.x + 12 \u003c 0) {\n                s.x = W + Math.random() * 30;\n                s.y = 5 + Math.random() * (H - 25);\n                s.spriteIdx = Math.floor(Math.random() * NEAR_CLOUDS.length);\n            }\n        }\n\n        // Update HUD score (HTML overlay). Updates every step is fine — the\n        // browser only repaints if the textContent actually changed.\n        hudScoreVal.textContent = String(intScore).padStart(5, '0');\n\n        if (!debugInvincible && collides()) onDeath();\n    }\n\n    // ---- RENDER ----\n    // Discrete palette interpolation — picks between two palettes based on bgPhase.\n    function bgColors() {\n        if (bgPhase \u003c 0.5) {\n            return { top: '#1e3a78', bot: '#6ea8d8' };\n        }\n        return { top: '#0d0822', bot: '#3a1858' };\n    }\n\n    function render() {\n        // ---- Sky bands ----\n        // Three discrete tiers selected by bgPhase (0=day, 1=space, 2=void).\n        // Each tier is 3 broad bands plus 1px transition stripes — soft\n        // enough to avoid the original \"stripey\" feel without breaking the\n        // discrete-color 8-bit aesthetic.\n        const tiers = [\n            // day\n            { bands: ['#1e3a78', '#3a6098', '#6098c8'], edges: ['#2a4f88', '#4a7eb0'] },\n            // space\n            { bands: ['#070420', '#100a30', '#1c1040'], edges: ['#0c0728', '#160c38'] },\n            // void — almost black, faintly purple\n            { bands: ['#020108', '#06031a', '#0a0628'], edges: ['#040214', '#080425'] }\n        ];\n        const tier = bgPhase >= 1.5 ? tiers[2] : bgPhase >= 0.5 ? tiers[1] : tiers[0];\n        const bands = tier.bands;\n        const edges = tier.edges;\n        const bandHeights = [0.55, 0.20, 0.25];\n        let yAcc = 0;\n        for (let i = 0; i \u003c 3; i++) {\n            ctx.fillStyle = bands[i];\n            ctx.fillRect(0, Math.round(yAcc * H), W, Math.round(bandHeights[i] * H) + 1);\n            yAcc += bandHeights[i];\n            if (i \u003c 2) {\n                ctx.fillStyle = edges[i];\n                ctx.fillRect(0, Math.round(yAcc * H) - 1, W, 1);\n            }\n        }\n\n        // ---- Far layer (parallax 0.10) — distant horizon dots ----\n        const farColor = bgPhase >= 1.5 ? '#1e1840'\n                       : bgPhase >= 0.5 ? '#3a3868'\n                       : '#406088';\n        ctx.fillStyle = farColor;\n        for (const s of farLayer) {\n            ctx.fillRect(s.x | 0, s.y | 0, 1, 1);\n        }\n\n        // ---- Mid layer (parallax 0.30) — bgStars ----\n        // Day: faint pale dust. Space: full twinkle. Void: cold sparse pinpoints.\n        if (bgPhase >= 1.5) {\n            for (const s of bgStars) {\n                const tw = 0.5 + 0.5 * Math.sin(s.phase);\n                ctx.fillStyle = tw > 0.85 ? '#d8c8f0' : tw > 0.55 ? '#7858a0' : '#3a285a';\n                ctx.fillRect(s.x | 0, s.y | 0, s.size, s.size);\n            }\n        } else if (bgPhase > 0.5) {\n            const base = Math.min(1, (bgPhase - 0.3) * 1.4);\n            for (const s of bgStars) {\n                const tw = 0.6 + 0.4 * Math.sin(s.phase);\n                const a = base * tw;\n                ctx.fillStyle = a > 0.7 ? '#fffde0' : a > 0.4 ? '#a8c8e8' : '#406088';\n                ctx.fillRect(s.x | 0, s.y | 0, s.size, s.size);\n            }\n        } else {\n            ctx.fillStyle = '#7898c0';\n            for (const s of bgStars) {\n                if ((s.phase | 0) % 4 \u003c 3) {\n                    ctx.fillRect(s.x | 0, s.y | 0, 1, 1);\n                }\n            }\n        }\n\n        // ---- Near layer (parallax ~0.55) — wispy cloud sprites ----\n        const nearPalette = bgPhase >= 1.5\n            ? ['#180c30', '#2a1850']\n            : bgPhase >= 0.5\n            ? ['#382860', '#5a4880']\n            : ['#7898c0', '#c8d8f0'];\n        for (const s of nearLayer) {\n            const sprite = NEAR_CLOUDS[s.spriteIdx];\n            drawSpriteFast(sprite, s.x, s.y, nearPalette);\n        }\n\n        // Horizon stripe in day mode for grounding\n        if (bgPhase \u003c 0.4) {\n            ctx.fillStyle = '#1a2040';\n            ctx.fillRect(0, H - 2, W, 2);\n        }\n\n        // ---- Obstacles ----\n        for (const o of obstacles) {\n            if (o.kind === 'planet') {\n                drawPlanet(o);\n            } else {\n                const palette = bgPhase >= 1.5 ? CLOUD_COLORS_VOID\n                              : bgPhase >= 0.5 ? CLOUD_COLORS_SPACE\n                              : CLOUD_COLORS_DAY;\n                const sprite = CLOUD_VARIANTS[o.variant || 0];\n                drawSpriteFast(sprite, o.x - 16, o.y - 6, palette);\n            }\n        }\n\n        // Player star — procedural, sized by starLevel (10 levels driven by\n        // score). Levels 0-9 → arm length 3-8 + optional pulsing halo dots\n        // at increasing radius. Drawn during play and the brief dying freeze.\n        if (state === 'playing' || state === 'dying') {\n            const armLen = LEVEL_ARM_LEN[starLevel];\n            const haloDist = LEVEL_HALO_DIST[starLevel];\n            const sx = star.x | 0;\n            const sy = star.y | 0;\n\n            // Trail dots (3-tail fading orange → yellow). Trail length scales\n            // slightly with star size so the bigger star reads as faster.\n            const trailReach = armLen + 5;\n            ctx.fillStyle = '#ff7028';\n            ctx.fillRect(sx - trailReach, sy, 1, 1);\n            ctx.fillStyle = '#ff944a';\n            ctx.fillRect(sx - trailReach + 2, sy, 1, 1);\n            ctx.fillStyle = '#ffd668';\n            ctx.fillRect(sx - trailReach + 4, sy, 1, 1);\n\n            // Thrust flame — only when actively holding.\n            if (holding && state === 'playing') {\n                const flickerA = (Math.floor(elapsed * 24) % 2) === 0;\n                const flameY = sy + armLen + 1;\n                ctx.fillStyle = flickerA ? '#ff7028' : '#ffd668';\n                ctx.fillRect(sx, flameY, 1, 2);\n                ctx.fillStyle = flickerA ? '#ffd668' : '#ff7028';\n                ctx.fillRect(sx - 1, flameY, 1, 1);\n                ctx.fillRect(sx + 1, flameY, 1, 1);\n            }\n\n            // ---- Star body (geometric 5-point pentagram sprite) ----\n            const sprite = STAR_SPRITES[starLevel];\n            ctx.fillStyle = '#ffd668';  // body (yellow)\n            for (let i = 0; i \u003c sprite.body.length; i++) {\n                const p = sprite.body[i];\n                ctx.fillRect(sx + p[0], sy + p[1], 1, 1);\n            }\n            ctx.fillStyle = '#fffde0';  // bright core (cream)\n            for (let i = 0; i \u003c sprite.core.length; i++) {\n                const p = sprite.core[i];\n                ctx.fillRect(sx + p[0], sy + p[1], 1, 1);\n            }\n\n            // Pulsing twinkle dots beyond the star tips, radius scales with level\n            if (haloDist > 0) {\n                const pulse = (Math.floor(elapsed * 4) % 2) === 0;\n                ctx.fillStyle = pulse ? '#ff944a' : '#ff7028';\n                // Place at the 5 outer pentagram angles, just past haloDist\n                for (let i = 0; i \u003c 5; i++) {\n                    const ang = -Math.PI / 2 + i * 2 * Math.PI / 5;\n                    const hx = Math.round(Math.cos(ang) * haloDist);\n                    const hy = Math.round(Math.sin(ang) * haloDist);\n                    ctx.fillRect(sx + hx, sy + hy, 1, 1);\n                }\n            }\n        }\n\n        // HUD now lives in HTML overlay (see #srunner-hud) — Hebrew labels\n        // render with native font, the chunky styling carries the 8-bit feel.\n    }\n\n    // ---- LOOP ----\n    function loop(ts) {\n        if (!lastFrameTs) lastFrameTs = ts;\n        let dt = (ts - lastFrameTs) / 1000;\n        if (dt > MAX_FRAME_DT) dt = MAX_FRAME_DT;\n        lastFrameTs = ts;\n\n        if (state === 'playing') {\n            dtAccumulator += dt;\n            while (dtAccumulator >= STEP_DT) {\n                step(STEP_DT);\n                dtAccumulator -= STEP_DT;\n                if (state !== 'playing') break;\n            }\n        } else if (state === 'menu') {\n            // Drift parallax on menu — gentle constant scroll so the screen\n            // feels alive even before the game starts.\n            const menuSpeed = 30;\n            for (const s of farLayer) {\n                s.x -= dt * menuSpeed * s.parallax;\n                if (s.x \u003c -1) { s.x = W + Math.random() * 8; s.y = Math.random() * H; }\n            }\n            for (const s of bgStars) {\n                s.x -= dt * menuSpeed * s.parallax;\n                s.phase += dt * 2;\n                if (s.x \u003c -2) { s.x = W + Math.random() * 6; s.y = Math.random() * (H - 6); }\n            }\n            for (const s of nearLayer) {\n                s.x -= dt * menuSpeed * s.parallax;\n                if (s.x + 12 \u003c 0) {\n                    s.x = W + Math.random() * 30;\n                    s.y = 5 + Math.random() * (H - 25);\n                    s.spriteIdx = Math.floor(Math.random() * NEAR_CLOUDS.length);\n                }\n            }\n            bgPhaseTarget = 1;\n            bgPhase += (bgPhaseTarget - bgPhase) * Math.min(1, dt * 0.2);\n        }\n\n        render();\n        requestAnimationFrame(loop);\n    }\n    requestAnimationFrame(loop);\n\n    // ---- SCREEN MANAGEMENT ----\n    function showScreen(name) {\n        const map = { menu: menuEl, gameover: gameoverEl, name: nameEl, lb: lbEl };\n        for (const key of Object.keys(map)) {\n            map[key].classList.toggle('hidden', key !== name);\n        }\n    }\n    function hideAllScreens() {\n        menuEl.classList.add('hidden');\n        gameoverEl.classList.add('hidden');\n        nameEl.classList.add('hidden');\n        lbEl.classList.add('hidden');\n    }\n\n    function fireFlash() {\n        flashEl.classList.remove('fire');\n        // Force reflow so animation re-fires\n        void flashEl.offsetWidth;\n        flashEl.classList.add('fire');\n    }\n\n    function showTutorial() {\n        tutorialActive = true;\n        tutorialElapsed = 0;\n        firstHoldHappened = false;\n        tutorialEl.classList.remove('gone');\n    }\n    function hideTutorial() {\n        tutorialActive = false;\n        tutorialEl.classList.add('gone');\n    }\n\n    // ---- MENU ----\n    function setMenuIndex(i) {\n        menuIndex = (i + menuItems.length) % menuItems.length;\n        menuItems.forEach((el, idx) => el.classList.toggle('selected', idx === menuIndex));\n        SFX.nav();\n    }\n    function activateMenu() {\n        const action = menuItems[menuIndex].getAttribute('data-action');\n        SFX.select();\n        if (action === 'play') startRun();\n        else if (action === 'scores') openLeaderboard();\n    }\n\n    function focusHost() {\n        // Called after any state transition that doesn't open a text input.\n        // Ensures keyboard events route through the document handler with the\n        // host as the focused target — and that arrow/space keys aren't\n        // siphoned by a stray \u003cli> that retains focus from a prior click.\n        try { host.focus({ preventScroll: true }); } catch (_) {\n            try { host.focus(); } catch (__) {}\n        }\n    }\n\n    menuItems.forEach((el, i) => {\n        el.addEventListener('mouseenter', () => setMenuIndex(i));\n        el.addEventListener('click', () => { setMenuIndex(i); activateMenu(); });\n    });\n\n    function showMenu() {\n        state = 'menu';\n        hideAllScreens();\n        showScreen('menu');\n        hudEl.classList.add('hidden');\n        bgPhaseTarget = 1;\n        focusHost();\n    }\n\n    // Fetch and display the reward string for a 1000-point tier. Idempotent:\n    // a cached tier reuses its prior response; an in-flight request short-\n    // circuits to avoid duplicate calls. Server returns null for tiers with\n    // no reward configured — we skip rendering in that case so the prior\n    // milestone line stays visible.\n    function showMilestoneText(text) {\n        if (!text || !milestoneEl) return;\n        milestoneEl.textContent = text;\n        milestoneEl.classList.add('show');\n    }\n    async function requestMilestone(tier) {\n        if (revealedMilestones.has(tier)) {\n            showMilestoneText(revealedMilestones.get(tier));\n            return;\n        }\n        if (milestoneClaimsInFlight.has(tier)) return;\n        if (!runId || typeof GameAPI.callFunction !== 'function') return;\n        milestoneClaimsInFlight.add(tier);\n        try {\n            const resp = await GameAPI.callFunction('claimStarRunnerMilestone', { runId, tier });\n            if (resp && typeof resp.code === 'string' && resp.code.length > 0) {\n                revealedMilestones.set(tier, resp.code);\n                if (state === 'playing') showMilestoneText(resp.code);\n            }\n        } catch (e) {\n            console.warn('[star_runner] claimMilestone failed', tier, e);\n        } finally {\n            milestoneClaimsInFlight.delete(tier);\n        }\n    }\n\n    // ---- RUN LIFECYCLE ----\n    async function startRun() {\n        if (state === 'playing') return;\n        // Reset\n        star = { x: STAR_X, y: H / 2, vy: 0 };\n        speed = SPEED_MIN;\n        distance = 0;\n        score = 0;\n        elapsed = 0;\n        warmup = 0;\n        obstacles = [];\n        nextSpawnAtDistance = 0;\n        bgPhase = 0;\n        bgPhaseTarget = 0;\n        starLevel = 0;\n        prevStarLevel = 0;\n        runId = null;\n        runStartedAt = 0;\n        hideAllScreens();\n        // HU             function _scheduleLoopOverlap(id) {
                const entry = activeLoopAudios[id];
                if (!entry || !entry.audio)
                    return;

                    clearTimeout(entry.timer);

                const trySchedule = () => {
                    if (!activeLoopAudios[id] || activeLoopAudios[id].audio !== audio)

                            once: true

            function _startNextLoopIteration(id) {

                const oldStep = (oldAudio.volume || 0.01) / xfadeSteps;

                newAudio.src = entry.url;

                if (targetVol > 0) {

                        if (newAudio.volume < targetVol - newStep) {
                            try {
                                newAudio.volume = Math.min(1, newAudio.volume + newStep);
                            } catch (_) {}
                        } else {
                            try {
                                newAudio.volume = targetVol;
                            } catch (_) {}
                            clearInterval(newFade);
                        }
                    }
                    , 30);
                }

                if (entry.timer)
                    clearTimeout(entry.timer);

            }

            function resumeActiveLoops(allowedLoopIds) {

            function duckAmbience(targetVolume) {
