<!DOCTYPE html>
<html lang="he" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Rising Sun HQ - Secure Terminal</title>
        <style>
            :root {
                --bg-color: #050505;
                --terminal-color: #ffb000;
                --terminal-dark: #805800;
                --alert-color: #ff003c;
                --border-style: 2px solid var(--terminal-color);
                --game-max-width: calc((100vh - 180px) * 16 / 9);
            }

            * {
                cursor: default !important;
                touch-action: manipulation;
            }

            body {
                margin: 0;
                background-color: var(--bg-color);
                color: var(--terminal-color);
                font-family: 'Courier New', Courier, monospace;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                overflow: hidden;
                user-select: none;
            }

            body::before {
                content: " ";
                display: block;
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                right: 0;
                background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
                z-index: 100;
                background-size: 100% 2px, 3px 100%;
                pointer-events: none;
            }

            header {
                width: 100%;
                max-width: var(--game-max-width);
                padding: 6px 15px;
                border-bottom: var(--border-style);
                display: flex;
                justify-content: space-between;
                align-items: center;
                box-sizing: border-box;
                background: #111;
                text-transform: uppercase;
                z-index: 10;
                font-size: 0.8rem;
                flex-shrink: 0;
            }

            #game-container {
                position: relative;
                width: 100%;
                max-width: var(--game-max-width);
                aspect-ratio: 16 / 9;
                background-color: #000;
                background-size: cover;
                background-position: center;
                border-left: var(--border-style);
                border-right: var(--border-style);
                overflow: hidden;
                transition: background-image 0.1s ease-in-out;
                flex-shrink: 1;
            }

            #fx-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
                pointer-events: none;
                background-size: cover;
                background-position: center;
                opacity: 0;
                transition: opacity linear;
            }

            #back-btn {
                display: none;
                background: rgba(0,0,0,0.8);
                color: var(--terminal-color);
                border: 1px solid var(--terminal-color);
                padding: 5px 12px;
                font-family: inherit;
                font-size: 0.85rem;
                cursor: pointer !important;
                z-index: 10;
            }

            #back-btn:hover {
                background: var(--terminal-color);
                color: #000;
            }

            #narration-indicator {
                display: none;
                position: absolute;
                top: 28px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 50;
                pointer-events: none;
            }

            #narration-indicator img {
                width: 56px;
                height: 56px;
                filter: drop-shadow(0 0 6px rgba(255, 160, 0, 0.8));
            }

            #narration-indicator.active {
                display: block;
                animation: narr-pulse 3.5s ease-in-out infinite;
            }

            @keyframes narr-pulse {
                0%, 100% {
                    opacity: 0.7;
                    transform: translateX(-50%) scale(1);
                }

                50% {
                    opacity: 1;
                    transform: translateX(-50%) scale(1.08);
                }
            }

            #replay-narration-btn {
                display: none;
                background: rgba(0,0,0,0.8);
                border: 1px solid var(--terminal-color);
                padding: 3px 5px;
                font-size: 0.9rem;
                cursor: pointer !important;
                z-index: 10;
                opacity: 0.55;
                transition: opacity 0.2s;
            }

            #replay-narration-btn:hover {
                opacity: 1;
                background: var(--terminal-color);
            }

            #bottom-bar {
                width: 100%;
                max-width: var(--game-max-width);
                display: flex;
                justify-content: flex-end;
                gap: 8px;
                padding: 4px 0;
                box-sizing: border-box;
                flex-shrink: 0;
            }

            #hotspot-layer {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
            }

            .svg-hotspot {
                fill: transparent;
                stroke: transparent;
                transition: fill 0.2s ease, filter 0.2s ease;
                pointer-events: all;
            }

            .svg-hotspot:hover {
                fill: rgba(255, 176, 0, 0.15);
            }

            .svg-hotspot.drop-target {
                fill: rgba(255, 176, 0, 0.25);
                stroke: rgba(255, 176, 0, 0.6);
                stroke-width: 2px;
                filter: drop-shadow(0 0 8px rgba(255, 176, 0, 0.4));
            }

            .svg-hotspot.drop-success {
                fill: rgba(255, 176, 0, 0.5);
                filter: drop-shadow(0 0 20px rgba(255, 176, 0, 0.8));
            }

            .svg-back-btn {
                fill: rgba(14, 99, 156, var(--back-btn-opacity, 0.15));
                stroke: rgba(14, 99, 156, 0.8);
                stroke-width: 1px;
                transition: all 0.2s ease;
                pointer-events: all;
                cursor: pointer !important;
            }

            .svg-back-btn:hover {
                fill: rgba(14, 99, 156, 0.7);
                stroke-width: 2px;
            }

            #inventory-bar {
                width: 100%;
                max-width: var(--game-max-width);
                height: 80px;
                border-top: var(--border-style);
                display: flex;
                align-items: center;
                padding: 0 10px;
                box-sizing: border-box;
                background: #0a0a0a;
                gap: 15px;
                overflow-x: auto;
                z-index: 10;
                flex-shrink: 0;
            }

            .inventory-item {
                width: 60px;
                height: 60px;
                border: 1px solid var(--terminal-dark);
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 0.7em;
                text-align: center;
                background: #111;
                background-size: cover;
                background-position: center;
                cursor: grab !important;
                position: relative;
                flex-shrink: 0;
                transition: transform 0.1s;
            }

            .inventory-item:active {
                cursor: grabbing !important;
                transform: scale(0.95);
            }

            .inventory-item span {
                display: block;
                background: rgba(0,0,0,0.7);
                width: 100%;
                padding: 2px 0;
            }

            #boot-screen, #jit-loader {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: var(--bg-color);
                z-index: 50;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
            }

            #jit-loader {
                display: none;
                z-index: 45;
            }

            .loading-dots {
                display: flex;
                gap: 8px;
                justify-content: center;
                align-items: center;
            }

            .loading-dots div {
                width: 12px;
                height: 12px;
                background-color: var(--terminal-color);
                border-radius: 50%;
                animation: bounce 1.4s infinite ease-in-out both;
            }

            .loading-dots div:nth-child(1) {
                animation-delay: -0.32s;
            }

            .loading-dots div:nth-child(2) {
                animation-delay: -0.16s;
            }

            @keyframes bounce {
                0%, 80%, 100% {
                    transform: scale(0);
                }

                40% {
                    transform: scale(1);
                }
            }

            .modal-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.85);
                z-index: 9999;
                justify-content: center;
                align-items: center;
            }

            .modal-content {
                background: var(--bg-color);
                border: var(--border-style);
                padding: 30px;
                max-width: 600px;
                width: 80%;
                text-align: center;
                box-shadow: 0 0 20px rgba(255, 176, 0, 0.2);
            }

            .modal-text {
                white-space: pre-wrap;
                text-align: right;
                line-height: 1.5;
                font-size: 1.1rem;
            }

            .modal-input {
                display: none;
                background: #000;
                border: 1px solid var(--terminal-color);
                color: var(--terminal-color);
                padding: 10px;
                font-family: inherit;
                font-size: 1.2rem;
                text-align: center;
                width: 80%;
                margin: 20px auto;
                direction: ltr;
            }

            .modal-input:focus {
                outline: none;
                background: #111;
            }

            .drop-zone {
                width: 120px;
                height: 120px;
                border: 2px dashed var(--terminal-dark);
                margin: 0 auto 20px;
                display: flex;
                justify-content: center;
                align-items: center;
                transition: all 0.2s;
                background: #0a0a0a;
                color: #555;
            }

            .drop-active {
                background-color: rgba(255,176,0,0.2);
                border-color: var(--terminal-color);
                color: var(--terminal-color);
            }

            @keyframes shakeError {
                0%, 100% {
                    transform: translateX(0);
                    border-color: var(--alert-color);
                    background-color: rgba(255,0,60,0.1);
                }

                20%, 60% {
                    transform: translateX(-10px);
                }

                40%, 80% {
                    transform: translateX(10px);
                }
            }

            .shake-error {
                animation: shakeError 0.4s ease-in-out;
            }

            button.terminal-btn {
                background: transparent;
                color: var(--terminal-color);
                border: 1px solid var(--terminal-color);
                padding: 8px 20px;
                font-family: inherit;
                margin: 10px;
                text-transform: uppercase;
                cursor: pointer !important;
            }

            button.terminal-btn:hover {
                background: var(--terminal-color);
                color: var(--bg-color);
            }

            #start-btn {
                font-size: 2.5rem;
                padding: 30px 60px;
                letter-spacing: 3px;
                border-width: 2px;
            }

            .reset-save-link {
                font-size: 0.8rem;
                color: #555;
                text-decoration: underline;
                cursor: pointer !important;
                margin-top: 50px;
            }

            .reset-save-link:hover {
                color: var(--danger);
            }

            /* NARRATION LOCK OVERLAY */
            #narration-lock-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 9990;
                cursor: default;
            }

            #narration-skip-bar {
                display: none;
                position: fixed;
                bottom: 60px;
                left: 50%;
                transform: translateX(-50%);
                width: 120px;
                height: 6px;
                background: rgba(255,255,255,0.15);
                border-radius: 3px;
                z-index: 9991;
                overflow: hidden;
            }

            #narration-skip-fill {
                width: 0%;
                height: 100%;
                background: var(--terminal-color, #00ff41);
                border-radius: 3px;
                transition: none;
            }

            /* PREFAB OVERLAY CSS */
            #prefab-overlay {
                display: none;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 99999;
                background: rgba(0,0,0,0.6);
                cursor: pointer !important;
            }

            #prefab-wrapper {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 100%;
                pointer-events: none;
            }

            #prefab-container {
                position: relative;
                background: transparent;
                border: none;
                overflow: hidden;
                box-sizing: border-box;
                pointer-events: auto;
                cursor: default !important;
                transition: width 0.2s, height 0.2s;
                flex-shrink: 0;
            }

            #close-prefab-btn {
                pointer-events: auto;
                background: rgba(0,0,0,0.8);
                color: var(--terminal-color);
                border: 1px solid var(--terminal-color);
                padding: 8px 20px;
                cursor: pointer !important;
                text-transform: uppercase;
                font-family: inherit;
                margin-top: 15px;
                flex-shrink: 0;
                box-shadow: 0 0 10px rgba(0,0,0,0.5);
            }

            #close-prefab-btn:hover {
                background: var(--terminal-color);
                color: #000;
            }

            /* SETTINGS BUTTON & PANEL */
            #settings-btn {
                background: rgba(0,0,0,0.8);
                color: var(--terminal-color);
                border: 1px solid var(--terminal-color);
                padding: 5px 10px;
                font-family: inherit;
                font-size: 0.9rem;
                cursor: pointer !important;
                z-index: 10;
                opacity: 0.55;
                transition: opacity 0.2s;
            }

            #settings-btn:hover {
                opacity: 1;
                background: var(--terminal-color);
                color: #000;
            }

            #settings-panel {
                display: none;
                position: fixed;
                bottom: 60px;
                left: 12px;
                background: rgba(5,5,5,0.96);
                border: 1px solid var(--terminal-color);
                padding: 14px 16px;
                z-index: 9998;
                width: 280px;
                box-shadow: 0 0 18px rgba(0,0,0,0.7);
                direction: rtl;
                font-family: inherit;
                color: var(--terminal-color);
            }

            #settings-panel h4 {
                margin: 0 0 10px;
                font-size: 0.95rem;
                border-bottom: 1px solid var(--terminal-dark);
                padding-bottom: 6px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .settings-row {
                display: flex;
                flex-direction: column;
                gap: 4px;
                margin-bottom: 10px;
                font-size: 0.8rem;
            }

            .settings-row .settings-label {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
            }

            .settings-row .settings-val {
                color: var(--terminal-dark);
                font-size: 0.75rem;
            }

            .settings-row input[type=range] {
                width: 100%;
                cursor: pointer !important;
                accent-color: var(--terminal-color);
            }

            #settings-panel .settings-close {
                background: transparent;
                color: var(--terminal-color);
                border: 1px solid var(--terminal-dark);
                padding: 4px 12px;
                font-family: inherit;
                font-size: 0.75rem;
                cursor: pointer !important;
                width: 100%;
                margin-top: 4px;
            }

            #settings-panel .settings-close:hover {
                background: var(--terminal-color);
                color: #000;
            }
        </style>
    </head>
    <body>
        <div id="boot-screen">
            <button id="start-btn" class="terminal-btn" onclick="startGame()">ברוכים הבאים!</button>
            <div id="wipe-btn" class="reset-save-link" style="display:none;" onclick="wipeSave()">[ אתחל התקדמות שחקן ]</div>
        </div>
        <div id="jit-loader">
            <div class="loading-dots">
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
        <header>
            <div id="connection-status">מאתחל...</div>
        </header>
        <div id="narration-lock-overlay">
            <div id="narration-skip-bar">
                <div id="narration-skip-fill"></div>
            </div>
        </div>
        <div id="game-container" ondragover="event.preventDefault()" ondrop="event.preventDefault()">
            <div id="narration-indicator">
                <img src="https://firebasestorage.googleapis.com/v0/b/nehoranterminal.firebasestorage.app/o/icons%2FFavicon.png?alt=media&token=c7df6d7f-949b-47b0-9586-4c25ef7e6599" alt="">
            </div>
            <div id="fx-overlay"></div>
            <svg id="hotspot-layer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"></svg>
            <div id="prefab-overlay" onclick="GameAPI.close()">
                <div id="prefab-wrapper">
                    <div id="prefab-container" onclick="event.stopPropagation()">
                        <button id="close-prefab-btn" onclick="GameAPI.close(); event.stopPropagation();" style="position: absolute; top: 5px; right: 5px; z-index: 10; margin: 0; font-size: 0.8rem; padding: 4px 10px;">סגור X</button>
                        <div id="prefab-content-mount" style="width: 100%; height: 100%; position: relative; overflow: auto; background:rgba(0,0,0,0.85); border:2px solid var(--terminal-color); box-shadow: 0 0 20px rgba(0,0,0,0.8); box-sizing: border-box;"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="inventory-bar">
            <div style="margin-left: 10px; color: var(--terminal-dark);">מלאי ציוד:</div>
        </div>
        <div id="bottom-bar">
            <button id="settings-btn" onclick="toggleSettingsPanel()" title="הגדרות">⚙</button>
            <button id="replay-narration-btn" onclick="replayRoomNarration()" title="השמע קריינות מחדש">
                <img src="https://firebasestorage.googleapis.com/v0/b/nehoranterminal.firebasestorage.app/o/icons%2FFavicon.png?alt=media&token=c7df6d7f-949b-47b0-9586-4c25ef7e6599" style="width:24px;height:24px;vertical-align:middle;">
            </button>
            <button id="back-btn" onclick="goBack()">⮌ חזור</button>
        </div>
        <div id="settings-panel">
            <h4>הגדרות</h4>
            <div class="settings-row">
                <div class="settings-label">
                    <span>עוצמה כללית</span>
                    <span class="settings-val" id="set-master-val">100%</span>
                </div>
                <input type="range" id="set-master" min="0" max="100" step="1">
            </div>
            <div class="settings-row">
                <div class="settings-label">
                    <span>קריינות</span>
                    <span class="settings-val" id="set-narration-val">100%</span>
                </div>
                <input type="range" id="set-narration" min="0" max="100" step="1">
            </div>
            <div class="settings-row">
                <div class="settings-label">
                    <span>אפקטי קול</span>
                    <span class="settings-val" id="set-sfx-val">100%</span>
                </div>
                <input type="range" id="set-sfx" min="0" max="100" step="1">
            </div>
            <div class="settings-row">
                <div class="settings-label">
                    <span>אווירה</span>
                    <span class="settings-val" id="set-ambience-val">100%</span>
                </div>
                <input type="range" id="set-ambience" min="0" max="100" step="1">
            </div>
            <div class="settings-row">
                <div class="settings-label">
                    <span>שקיפות כפתור "חזור"</span>
                    <span class="settings-val" id="set-backop-val">15%</span>
                </div>
                <input type="range" id="set-backop" min="0" max="100" step="1">
            </div>
            <button class="settings-close" onclick="toggleSettingsPanel()">סגור</button>
        </div>
        <div id="modal-overlay" class="modal-overlay">
            <div class="modal-content">
                <img id="modal-icon" style="display:none; width:80px; height:80px; object-fit:contain; margin: 0 auto 10px; filter: drop-shadow(0 0 8px rgba(255,176,0,0.4));">
                <h3 id="modal-title"></h3>
                <p id="modal-text" class="modal-text"></p>
                <input type="text" id="modal-input" class="modal-input" autocomplete="off">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 15px;">
                    <button class="terminal-btn" id="modal-submit-btn" style="width: 100%; box-sizing: border-box; margin: 0;">הזן</button>
                    <button class="terminal-btn" id="modal-link-btn" style="display:none; width: 100%; box-sizing: border-box; margin: 0;">קישור</button>
                    <button class="terminal-btn" id="modal-close-btn" onclick="closeModal()" style="width: 100%; box-sizing: border-box; margin: 0;">סגור</button>
                </div>
            </div>
        </div>
        <div id="use-modal-overlay" class="modal-overlay">
            <div class="modal-content">
                <h3 id="use-modal-title" style="color: var(--terminal-color); margin-top:0;"></h3>
                <p id="use-modal-text" class="modal-text" style="margin-bottom: 20px; text-align:center;"></p>
                <div id="use-drop-zone" class="drop-zone" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="dropItem(event)">
                    <span style="pointer-events: none; font-size: 0.85rem; text-align:center;">
                        גרור לכאן<br>או לחץ למטה
                    </span>
                </div>
                <div id="use-modal-inventory" style="display:flex; gap:10px; justify-content:center; margin-bottom: 20px; flex-wrap: wrap; background: #050505; padding: 10px; border: 1px solid #222; min-height: 60px;"></div>
                <div>
                    <button class="terminal-btn" onclick="closeUseModal()">סגור / בטל</button>
                </div>
            </div>
        </div>
        <script type="module">
            const BACK_BTN_OPACITY = "25";
            const HIDE_BACK_GLOBAL = true;

            // --- USER SETTINGS (audio + back-hotspot opacity) ---
            const USER_SETTINGS_KEY = 'nehoran_user_settings';
            const userSettings = (function() {
                let s = {};
                try {
                    s = JSON.parse(localStorage.getItem(USER_SETTINGS_KEY) || '{}') || {};
                } catch (_) {
                    s = {};
                }
                const def = Number(BACK_BTN_OPACITY);
                return {
                    master: typeof s.master === 'number' ? s.master : 1,
                    narration: typeof s.narration === 'number' ? s.narration : 1,
                    sfx: typeof s.sfx === 'number' ? s.sfx : 1,
                    ambience: typeof s.ambience === 'number' ? s.ambience : 1,
                    backOpacity: typeof s.backOpacity === 'number' ? s.backOpacity : (isFinite(def) ? def : 15)
                };
            }
            )();
            function saveUserSettings() {
                try {
                    localStorage.setItem(USER_SETTINGS_KEY, JSON.stringify(userSettings));
                } catch (_) {}
            }
            function getNarrationVol() {
                return userSettings.master * userSettings.narration;
            }
            function getSfxVol() {
                return userSettings.master * userSettings.sfx;
            }
            function getAmbienceVol() {
                return userSettings.master * userSettings.ambience;
            }
            function applyBackOpacityFromSettings() {
                document.documentElement.style.setProperty('--back-btn-opacity', (userSettings.backOpacity / 100).toString());
            }
            applyBackOpacityFromSettings();

            import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
            import {getFirestore, doc, getDoc, setDoc, onSnapshot, updateDoc} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
            import {getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

  }\r\n\r\n    .red-button:disabled {\r\n        cursor: not-allowed;\r\n    }\r\n\u003c/style>\r\n\r\n\u003cdiv class=\"btn-prefab-container\">\r\n    \u003cdiv class=\"btn-panel\">\r\n        \u003cdiv class=\"status-light\" id=\"indicator\">\u003c/div>\r\n        \r\n        \u003cdiv class=\"button-wrapper\">\r\n            \u003cbutton class=\"red-button\" id=\"main-btn\" onclick=\"pressButton()\">\u003c/button>\r\n        \u003c/div>\r\n    \u003c/div>\r\n\u003c/div>\r\n\r\n\u003cscript>\r\n    const params = (window.GameAPI && window.GameAPI.params) || {};\r\n    const FLAG = (params.flag || 'global_lights_off').toString();\r\n    const DURATION_SEC = Number.isFinite(Number(params.duration)) ? Number(params.duration) : 5;\r\n\r\n    function pressButton() {\r\n        const btn = document.getElementById('main-btn');\r\n        const indicator = document.getElementById('indicator');\r\n\r\n        if(btn.disabled) return;\r\n\r\n        btn.disabled = true;\r\n        btn.classList.add('pressed');\r\n        indicator.classList.add('active');\r\n\r\n        // Global multiplayer flag — written to Firestore via the runtime.\r\n        // Passing duration sets a future-timestamp value; isFlagActive treats\r\n        // numeric global values as auto-expiring, so no manual cleanup needed.\r\n        GameAPI.triggerGlobal(FLAG, DURATION_SEC);\r\n\r\n        setTimeout(() => {\r\n            btn.classList.remove('pressed');\r\n            indicator.classList.remove('active');\r\n            btn.disabled = false;\r\n        }, DURATION_SEC * 1000);\r\n    }\r\n\u003c/script>",

                    "html": "\u003cstyle>\n    .radio-container {\n        height: 100%;\n        width: 100%;\n        display: flex;\n        justify-content: center;\n        align-items: center;\n        font-family: 'Courier New', monospace;\n        user-select: none;\n    }\n\n    .radio-body {\n        background: linear-gradient(145deg, #2a2118, #1a1410);\n        padding: 30px 40px;\n        border-radius: 16px;\n        border: 2px solid #3a2a1a;\n        box-shadow: 0 15px 40px rgba(0,0,0,0.8), inset 0 1px 3px rgba(255,255,255,0.05);\n        display: flex;\n        flex-direction: column;\n        align-items: center;\n        gap: 20px;\n        min-width: 260px;\n    }\n\n    .radio-speaker {\n        width: 180px;\n        height: 180px;\n        border-radius: 50%;\n        background: repeating-radial-gradient(\n            circle,\n            #1a1410 0px, #1a1410 2px,\n            #2a2118 2px, #2a2118 4px\n        );\n        border: 3px solid #3a2a1a;\n        box-shadow: inset 0 5px 20px rgba(0,0,0,0.6);\n        position: relative;\n        overflow: hidden;\n    }\n\n    .radio-speaker::after {\n        content: '';\n        position: absolute;\n        top: 50%;\n        left: 50%;\n        transform: translate(-50%, -50%);\n        width: 40px;\n        height: 40px;\n        border-radius: 50%;\n        background: radial-gradient(circle, #3a2a1a, #2a2118);\n        border: 2px solid #4a3a2a;\n    }\n\n    .speaker-glow {\n        position: absolute;\n        top: 0; left: 0; right: 0; bottom: 0;\n        border-radius: 50%;\n        box-shadow: inset 0 0 30px rgba(255, 140, 0, 0);\n        transition: box-shadow 0.5s ease;\n    }\n\n    .speaker-glow.active {\n        box-shadow: inset 0 0 30px rgba(255, 140, 0, 0.15);\n        animation: pulse-glow 2s ease-in-out infinite;\n    }\n\n    .speaker-glow.signal {\n        box-shadow: inset 0 0 40px rgba(255, 140, 0, 0.35);\n        animation: pulse-glow 1.4s ease-in-out infinite;\n    }\n\n    @keyframes pulse-glow {\n        0%, 100% { box-shadow: inset 0 0 30px rgba(255, 140, 0, 0.1); }\n        50% { box-shadow: inset 0 0 40px rgba(255, 140, 0, 0.25); }\n    }\n\n    .radio-controls {\n        display: flex;\n        align-items: center;\n        gap: 20px;\n    }\n\n    .radio-indicator {\n        width: 10px;\n        height: 10px;\n        border-radius: 50%;\n        background: #331a00;\n        border: 1px solid #4a3a2a;\n        transition: all 0.3s ease;\n    }\n\n    .radio-indicator.on {\n        background: #ff8c00;\n        box-shadow: 0 0 12px #ff8c00, 0 0 4px #ff8c00;\n    }\n\n    .radio-toggle {\n        width: 70px;\n        height: 70px;\n        border-radius: 50%;\n        background: linear-gradient(145deg, #555, #333);\n        border: 3px solid #666;\n        cursor: pointer;\n        box-shadow: 0 6px 0 #222, 0 10px 20px rgba(0,0,0,0.5);\n        transition: all 0.1s ease;\n        position: relative;\n        top: -3px;\n        outline: none;\n        display: flex;\n        justify-content: center;\n        align-items: center;\n    }\n\n    .radio-toggle:active {\n        top: 3px;\n        box-shadow: 0 0 0 #222, 0 3px 8px rgba(0,0,0,0.4);\n    }\n\n    .radio-toggle .knob-line {\n        width: 2px;\n        height: 20px;\n        background: #999;\n        border-radius: 1px;\n        transform: rotate(0deg);\n        transition: transform 0.3s ease;\n    }\n\n    .radio-toggle.on .knob-line {\n        transform: rotate(90deg);\n    }\n\n    .radio-label {\n        color: #665544;\n        font-size: 0.7rem;\n        letter-spacing: 3px;\n        text-transform: uppercase;\n    }\n\u003c/style>\n\n\u003cdiv class=\"radio-container\">\n    \u003cdiv class=\"radio-body\">\n        \u003cdiv class=\"radio-speaker\">\n            \u003cdiv class=\"speaker-glow\" id=\"speaker-glow\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"radio-controls\">\n            \u003cdiv class=\"radio-indicator\" id=\"radio-indicator\">\u003c/div>\n            \u003cbutton class=\"radio-toggle\" id=\"radio-toggle\" onclick=\"toggleRadio()\">\n                \u003cdiv class=\"knob-line\">\u003c/div>\n            \u003c/button>\n        \u003c/div>\n    \u003c/div>\n\u003c/div>\n\n\u003cscript type=\"application/json\" id=\"prefab-params\">\n{\n    \"tracks\": { \"type\": \"textarea\", \"label\": \"URLs של שידורים (אחד בכל שורה, אופציונלי |שניות לעקוף משך)\", \"default\": \"\", \"rows\": 6, \"placeholder\": \"https://.../broadcast1.mp3\\nhttps://.../broadcast2.mp3|180\" },\n    \"noiseUrl\": { \"type\": \"text\", \"label\": \"URL של רעש לבן (לופ)\", \"default\": \"\" },\n    \"transmissionUrl\": { \"type\": \"text\", \"label\": \"URL של צליל 'שידור התקבל' (מתנגן מעל הרעש לפני כל קטע)\", \"default\": \"\" },\n    \"transmissionLeadSeconds\": { \"type\": \"number\", \"label\": \"כמה שניות לפני הקטע מנגנים את ה'שידור'\", \"default\": 3 },\n    \"gapSeconds\": { \"type\": \"number\", \"label\": \"משך הרעש בין שידורים (שניות)\", \"default\": 60 },\n    \"fallbackTrackSeconds\": { \"type\": \"number\", \"label\": \"משך ברירת מחדל אם metadata נכשל (שניות)\", \"default\": 120 },\n    \"ambienceDuck\": { \"type\": \"number\", \"label\": \"הנמכת אמביינס החדר (0-1, 1 = ללא הנמכה)\", \"default\": 0.2 }\n}\n\u003c/script>\n\n\u003cscript>\n    (function() {\n        const CROSSFADE_MS = 150;\n        const FADE_STEP_MS = 50;\n        const STATE_KEY = '__radioPrefabState';\n\n        // Persists across prefab open/close. The prefab DOM gets wiped on\n        // GameAPI.close() but Audio() elements + setTimeout chains live on\n        // window-scoped state, so the radio keeps broadcasting until the\n        // user explicitly toggles it off.\n        // isOn = user toggle state (survives room changes).\n        // audioActive = whether audio is actually playing right now (only true\n        // while in the home room). homeRoom is captured lazily from the first\n        // roomchange after toggle-on.\n        const G = window[STATE_KEY] = window[STATE_KEY] || {\n            isOn: false,\n            audioActive: false,\n            homeRoom: null,\n            trackAudio: null,\n            noiseAudio: null,\n            advanceTimer: null,\n            stingerTimer: null,\n            segs: null,\n            cfg: null,\n            currentKind: null\n        };\n\n        function parseConfig(p) {\n            const rawTracks = String(p.tracks || '').trim();\n            const tracks = rawTracks\n                .split(/\\r?\\n/)\n                .map(s => s.trim())\n                .filter(Boolean)\n                .map(line => {\n                    const idx = line.lastIndexOf('|');\n                    if (idx > 0) {\n                        const dur = Number(line.slice(idx + 1).trim());\n                        if (!isNaN(dur) && dur > 0) return { url: line.slice(0, idx).trim(), dur };\n                    }\n                    return { url: line, dur: null };\n                });\n            return {\n                tracks,\n                noiseUrl: String(p.noiseUrl || '').trim(),\n                transmissionUrl: String(p.transmissionUrl || '').trim(),\n                transmissionLead: Math.max(0.5, Number(p.transmissionLeadSeconds) || 3),\n                gapSec: Math.max(1, Number(p.gapSeconds) || 60),\n                fallbackDur: Math.max(5, Number(p.fallbackTrackSeconds) || 120),\n                duckLevel: (typeof p.ambienceDuck === 'number') ? p.ambienceDuck : 0.2\n            };\n        }\n\n        function fadeVolume(audio, target, ms, onDone) {\n            if (!audio) { if (onDone) onDone(); return; }\n            const start = audio.volume;\n            const steps = Math.max(1, Math.round(ms / FADE_STEP_MS));\n            const delta = (target - start) / steps;\n            let i = 0;\n            const id = setInterval(() => {\n                i++;\n                audio.volume = Math.max(0, Math.min(1, start + delta * i));\n                if (i >= steps) {\n                    clearInterval(id);\n                    audio.volume = Math.max(0, Math.min(1, target));\n                    if (onDone) onDone();\n                }\n            }, FADE_STEP_MS);\n        }\n\n        function probeDurations(tracks, fallbackDur) {\n            const promises = tracks.map(t => new Promise(resolve => {\n                if (t.dur) return resolve();\n                const probe = new Audio();\n                probe.preload = 'metadata';\n                let done = false;\n                const finish = (d) => {\n                    if (done) return;\n                    done = true;\n                    t.dur = (d && isFinite(d) && d > 0) ? d : fallbackDur;\n                    probe.src = '';\n                    resolve();\n                };\n                probe.addEventListener('loadedmetadata', () => finish(probe.duration));\n                probe.addEventListener('error', () => finish(null));\n                setTimeout(() => finish(null), 8000);\n                probe.src = t.url;\n            }));\n            return Promise.all(promises);\n        }\n\n        function buildSegments(cfg) {\n            const segs = [];\n            cfg.tracks.forEach((t, i) => {\n                segs.push({ kind: 'track', idx: i, url: t.url, dur: t.dur || cfg.fallbackDur });\n                segs.push({ kind: 'gap', dur: cfg.gapSec });\n            });\n            return segs;\n        }\n\n        // Wall-clock anchored to Unix epoch — all players land on the same\n        // segment + offset regardless of when they tuned in.\n        function currentState(segs, gapDefault) {\n            if (!segs.length) return { kind: 'gap', offset: 0, dur: Infinity };\n            const total = segs.reduce((s, x) => s + x.dur, 0);\n            if (total \u003c= 0) return { kind: 'gap', offset: 0, dur: Infinity };\n            let pos = (Date.now() / 1000) % total;\n            for (const s of segs) {\n                if (pos \u003c s.dur) return { kind: s.kind, idx: s.idx, url: s.url, offset: pos, dur: s.dur };\n                pos -= s.dur;\n            }\n            return { kind: 'gap', offset: 0, dur: gapDefault };\n        }\n\n        function ensureNoise() {\n            if (G.noiseAudio) return;\n            if (!G.cfg || !G.cfg.noiseUrl) return;\n            G.noiseAudio = new Audio();\n            G.noiseAudio.loop = true;\n            G.noiseAudio.src = G.cfg.noiseUrl;\n            G.noiseAudio.volume = 0;\n            G.noiseAudio.play().catch(() => {});\n        }\n\n        function stopTrack() {\n            if (!G.trackAudio) return;\n            const a = G.trackAudio;\n            G.trackAudio = null;\n            fadeVolume(a, 0, CROSSFADE_MS, () => { try { a.pause(); a.src = ''; } catch(e) {} });\n        }\n\n        // One-shot stinger layered over the noise — no fades, no tracking.\n        // Fire-and-forget; if the user tunes in too late we just don't\n        // schedule one for the imminent track.\n        function playStinger() {\n            if (!G.cfg || !G.cfg.transmissionUrl) return;\n            const s = new Audio();\n            s.src = G.cfg.transmissionUrl;\n            s.volume = 1;\n            s.play().catch(() => {});\n        }\n\n        function applyGlowToDOM() {\n            const glow = document.getElementById('speaker-glow');\n            if (!glow) return;\n            if (!G.isOn) {\n                glow.classList.remove('active');\n                glow.classList.remove('signal');\n                return;\n            }\n            glow.classList.add('active');\n            if (G.currentKind === 'track') glow.classList.add('signal');\n            else glow.classList.remove('signal');\n        }\n\n        // Render whatever segment is currently live. Called on toggle-on and\n        // again at each segment boundary.\n        function renderCurrentSegment() {\n            if (!G.segs || !G.cfg) return;\n            const st = currentState(G.segs, G.cfg.gapSec);\n            G.currentKind = st.kind;\n            applyGlowToDOM();\n\n            if (G.stingerTimer) { clearTimeout(G.stingerTimer); G.stingerTimer = null; }\n\n            if (st.kind === 'track' && st.url) {\n                stopTrack();\n                const a = new Audio();\n                a.src = st.url;\n                a.volume = 0;\n                G.trackAudio = a;\n                // currentTime must be set after metadata is ready or some\n                // browsers ignore it; do it on canplay as a safer hook.\n                // Guard against late-firing canplay for an already-superseded\n                // audio element by checking we're still the active track.\n                const seekAndPlay = () => {\n                    if (G.trackAudio !== a) return;\n                    try { a.currentTime = Math.max(0, st.offset); } catch(e) {}\n                    a.play().catch(() => {});\n                    fadeVolume(a, 1, CROSSFADE_MS);\n                    if (G.noiseAudio) fadeVolume(G.noiseAudio, 0, CROSSFADE_MS);\n                };\n                if (a.readyState >= 2) seekAndPlay();\n                else a.addEventListener('canplay', seekAndPlay, { once: true });\n            } else {\n                ensureNoise();\n                stopTrack();\n                if (G.noiseAudio) fadeVolume(G.noiseAudio, 1, CROSSFADE_MS);\n\n                // Schedule stinger before next track only if there's enough\n                // lead time; if we tuned in within the lead window, skip it\n                // so it doesn't bleed into the track start.\n                const remainSec = st.dur - st.offset;\n                const leadSec = G.cfg.transmissionLead;\n                if (G.cfg.transmissionUrl && remainSec >= leadSec) {\n                    const delayMs = (remainSec - leadSec) * 1000;\n                    G.stingerTimer = setTimeout(playStinger, delayMs);\n                }\n            }\n\n            const remainMs = Math.max(50, (st.dur - st.offset) * 1000 + 20);\n            if (G.advanceTimer) clearTimeout(G.advanceTimer);\n            G.advanceTimer = setTimeout(renderCurrentSegment, remainMs);\n        }\n\n        async function startRadio(cfg) {\n            G.cfg = cfg;\n            await probeDurations(cfg.tracks, cfg.fallbackDur);\n            if (!G.isOn) return;\n            G.segs = buildSegments(cfg);\n            if (!G.segs.length) {\n                ensureNoise();\n                if (G.noiseAudio) fadeVolume(G.noiseAudio, 1, CROSSFADE_MS);\n                G.currentKind = 'gap';\n                applyGlowToDOM();\n                return;\n            }\n            renderCurrentSegment();\n        }\n\n        function stopRadio() {\n            if (G.advanceTimer) { clearTimeout(G.advanceTimer); G.advanceTimer = null; }\n            if (G.stingerTimer) { clearTimeout(G.stingerTimer); G.stingerTimer = null; }\n            stopTrack();\n            if (G.noiseAudio) {\n                const a = G.noiseAudio;\n                G.noiseAudio = null;\n                fadeVolume(a, 0, CROSSFADE_MS, () => { try { a.pause(); a.src = ''; } catch(e) {} });\n            }\n            G.segs = null;\n            G.currentKind = null;\n        }\n\n        function syncUIToState() {\n            const toggle = document.getElementById('radio-toggle');\n            const indicator = document.getElementById('radio-indicator');\n            if (G.isOn) {\n                if (toggle) toggle.classList.add('on');\n                if (indicator) indicator.classList.add('on');\n            } else {\n                if (toggle) toggle.classList.remove('on');\n                if (indicator) indicator.classList.remove('on');\n            }\n            applyGlowToDOM();\n        }\n\n        // Mount-time sync: reflect persistent state, re-apply ambience duck if\n        // running, and clear a stale radio_on flag if the audio state was lost\n        // (e.g. page reload — flag persists in localStorage but G doesn't, and\n        // the room-change listener can't clear it since it fires while no\n        // prefab is active and GameAPI gates flag mutations on that).\n        // Mount only happens in the radio's home room, so if isOn but audio\n        // isn't active (e.g. first toggle-on this session, or coming back via\n        // the modal rather than the silent listener path), we resume here.\n        syncUIToState();\n        if (G.isOn) {\n            const dl = (G.cfg && typeof G.cfg.duckLevel === 'number') ? G.cfg.duckLevel : 0.2;\n            if (GameAPI.duckAmbience) GameAPI.duckAmbience(dl);\n            if (!G.audioActive && G.cfg) {\n                G.audioActive = true;\n                startRadio(G.cfg);\n            }\n        } else if (GameAPI.hasFlag && GameAPI.hasFlag('radio_on')) {\n            GameAPI.removeFlag('radio_on');\n        }\n\n        // The radio toggle state (isOn) survives room changes — the player can\n        // turn it on, walk away, come back, and find it still on. Audio only\n        // plays while in the home room: leaving mutes/stops it, returning\n        // resumes in sync with the global wall-clock timeline.\n        // Engine dispatches nehoran:roomchange only on real navigation, not on\n        // GameAPI.close()'s silent reload. Bind once per page load.\n        if (!window.__radioRoomchangeBound) {\n            window.__radioRoomchangeBound = true;\n            window.addEventListener('nehoran:roomchange', (e) => {\n                if (!G.isOn) return;\n                const fromHash = e && e.detail && e.detail.fromHash;\n                const toHash = e && e.detail && e.detail.toHash;\n                // Lazy-capture: prefab can only mount in the home room, so the\n                // first leave's fromHash IS the home room.\n                if (!G.homeRoom && fromHash) G.homeRoom = fromHash;\n\n                if (G.homeRoom && toHash === G.homeRoom) {\n                    if (!G.audioActive && G.cfg) {\n                        G.audioActive = true;\n                        if (GameAPI.duckAmbience) GameAPI.duckAmbience(G.cfg.duckLevel);\n                        startRadio(G.cfg);\n                    }\n                } else {\n                    if (G.audioActive) {\n                        G.audioActive = false;\n                        if (GameAPI.duckAmbience) GameAPI.duckAmbience(1);\n                        stopRadio();\n                    }\n                }\n            });\n        }\n\n        window.toggleRadio = function() {\n            if (!G.isOn) {\n                G.isOn = true;\n                G.audioActive = true;\n                const params = (window.GameAPI && GameAPI.params) || {};\n                const cfg = parseConfig(params);\n                if (GameAPI.duckAmbience) GameAPI.duckAmbience(cfg.duckLevel);\n                GameAPI.setFlag('radio_on');\n                syncUIToState();\n                startRadio(cfg);\n            } else {\n                G.isOn = false;\n                G.audioActive = false;\n                if (GameAPI.duckAmbience) GameAPI.duckAmbience(1);\n                GameAPI.removeFlag('radio_on');\n                stopRadio();\n                syncUIToState();\n            }\n        };\n    })();\n\u003c/script>\n",

                "elevator_active": {
                    "html": "\u003cscript type=\"application/json\" id=\"prefab-params\">\n{\n    \"currentFloor\": {\"type\": \"number\", \"label\": \"קומה נוכחית\", \"default\": 4},\n    \"targetFloor\": {\"type\": \"number\", \"label\": \"קומת יעד\", \"default\": 2},\n    \"targetRoom\": {\"type\": \"text\", \"label\": \"חדר יעד (Room ID)\", \"default\": \"\"},\n    \"totalFloors\": {\"type\": \"number\", \"label\": \"מספר קומות\", \"default\": 5}\n}\n\u003c/script>\n\n\u003cstyle>\n    .elevator-container {\n        height: 100%;\n        width: 100%;\n        display: flex;\n        justify-content: center;\n        align-items: center;\n        font-family: 'Courier New', monospace;\n        user-select: none;\n    }\n\n    .elevator-panel {\n        background: linear-gradient(180deg, #4a4440, #3a3633, #2e2b28);\n        padding: 20px 14px;\n        border-radius: 6px;\n        border: 1px solid #5a5550;\n        box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.08);\n        display: flex;\n        flex-direction: column;\n        align-items: center;\n        gap: 10px;\n        position: relative;\n    }\n\n    .elevator-panel::before,\n    .elevator-panel::after {\n        content: '';\n        position: absolute;\n        left: 50%;\n        transform: translateX(-50%);\n        width: 6px;\n        height: 6px;\n        border-radius: 50%;\n        background: #555;\n        box-shadow: 0 0 2px rgba(0,0,0,0.5);\n    }\n    .elevator-panel::before { top: 6px; }\n    .elevator-panel::after { bottom: 6px; background: #00ff41; box-shadow: 0 0 6px #00ff41; }\n\n    .floor-btn {\n        width: 52px;\n        height: 52px;\n        border-radius: 50%;\n        background: linear-gradient(145deg, #3a3835, #2a2825);\n        border: 2px solid #555;\n        color: #999;\n        font-family: 'Courier New', monospace;\n        font-size: 1.3rem;\n        font-weight: bold;\n        cursor: not-allowed;\n        outline: none;\n        position: relative;\n        display: flex;\n        justify-content: center;\n        align-items: center;\n        box-shadow: 0 3px 8px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.05);\n        transition: all 0.3s ease;\n    }\n\n    .floor-btn .btn-ring {\n        position: absolute;\n        top: 3px; left: 3px; right: 3px; bottom: 3px;\n        border-radius: 50%;\n        border: 1px solid rgba(255,255,255,0.12);\n        pointer-events: none;\n    }\n\n    .floor-btn.active {\n        cursor: pointer;\n        color: #bbb;\n    }\n\n    .floor-btn.active:hover {\n        border-color: #ffb000;\n        color: #ffb000;\n        box-shadow: 0 3px 8px rgba(0,0,0,0.5), 0 0 10px rgba(255,176,0,0.15), inset 0 1px 2px rgba(255,255,255,0.05);\n    }\n\n    .floor-btn.active:active {\n        transform: scale(0.93);\n    }\n\n    .floor-btn.lit {\n        border-color: #ffb000;\n        color: #ffb000;\n        box-shadow: 0 3px 8px rgba(0,0,0,0.5), 0 0 18px rgba(255,176,0,0.35), inset 0 1px 2px rgba(255,255,255,0.05);\n    }\n\u003c/style>\n\n\u003cdiv class=\"elevator-container\">\n    \u003cdiv class=\"elevator-panel\" id=\"elev-panel\">\u003c/div>\n\u003c/div>\n\n\u003cscript>\n    (function() {\n        const p = GameAPI.params || {};\n        const currentFloor = p.currentFloor || 4;\n        const targetFloor = p.targetFloor || 2;\n        const targetRoom = p.targetRoom || '';\n        const totalFloors = p.totalFloors || 5;\n\n        const panel = document.getElementById('elev-panel');\n\n        for (let i = totalFloors; i >= 1; i--) {\n            const btn = document.createElement('button');\n            btn.className = 'floor-btn';\n            btn.id = 'floor-' + i;\n            btn.innerHTML = '\u003cspan>' + i + '\u003c/span>\u003cdiv class=\"btn-ring\">\u003c/div>';\n\n            if (i === currentFloor || i === targetFloor) {\n                btn.classList.add('active');\n                btn.style.cursor = 'pointer';\n                btn.addEventListener('click', () => handleFloor(i));\n            }\n\n            panel.appendChild(btn);\n        }\n\n        const BUTTON_SOUND = 'https://firebasestorage.googleapis.com/v0/b/nehoranterminal.firebasestorage.app/o/one-offs%2Feffect_elevator_button.mp3?alt=media';\n\n        function handleFloor(floor) {\n            const btn = document.getElementById('floor-' + floor);\n            if (!btn || btn.classList.contains('lit')) return;\n\n            try { GameAPI.playSound(BUTTON_SOUND); } catch (_) {}\n            btn.classList.add('lit');\n\n            if (floor === currentFloor) {\n                setTimeout(() => { btn.classList.remove('lit'); }, 400);\n            } else if (floor === targetFloor && targetRoom) {\n                GameAPI.fadeToBlack(1200).then(async () => {\n                    try {\n                        if (typeof GameAPI.requireDiscordAuth === 'function') {\n                            await GameAPI.requireDiscordAuth();\n                        }\n                    } catch (e) {\n                        console.error('[elevator] discord auth failed', e);\n                        return;\n                    }\n                    GameAPI.goToRoom(targetRoom);\n                });\n            }\n        }\n    })();\n\u003c/script>\n",

 3px; left: 3px; right: 3px; bottom: 3px;\n        border-radius: 50%;\n        border: 1px solid rgba(255,255,255,0.08);\n        pointer-events: none;\n    }\n\u003c/style>\n\n\u003cdiv class=\"elevator-container\">\n    \u003cdiv class=\"elevator-panel\" id=\"elev-panel\">\u003c/div>\n\u003c/div>\n\n\u003cscript>\n    (function() {\n        const totalFloors = (GameAPI.params && GameAPI.params.totalFloors) || 5;\n        const panel = document.getElementById('elev-panel');\n\n        for (let i = totalFloors; i >= 1; i--) {\n            const btn = document.createElement('button');\n            btn.className = 'floor-btn';\n            btn.innerHTML = '\u003cspan>' + i + '\u003c/span>\u003cdiv class=\"btn-ring\">\u003c/div>';\n            panel.appendChild(btn);\n        }\n    })();\n\u003c/script>\n",

                "solaris": {
                    "html": "\u003cstyle>\n    .deploy-container {\n        height: 100%;\n        width: 100%;\n        display: flex;\n        justify-content: center;\n        align-items: center;\n        font-family: 'Arial Black', 'Impact', Helvetica, sans-serif;\n    }\n\n    .deploy-panel {\n        background: #0d0d0d;\n        padding: 40px 50px;\n        border-radius: 14px;\n        border: 1px solid #222;\n        box-shadow: 0 20px 60px rgba(0,0,0,0.9);\n        display: flex;\n        flex-direction: column;\n        align-items: center;\n        gap: 20px;\n    }\n\n    .deploy-logo {\n        font-size: 2.8rem;\n        font-weight: 900;\n        color: #ff4d00;\n        text-shadow: 0 2px 12px rgba(255,69,0,0.35);\n        letter-spacing: 2px;\n    }\n\n    .deploy-status {\n        display: flex;\n        align-items: center;\n        gap: 8px;\n        font-family: monospace;\n        font-size: 0.7rem;\n        letter-spacing: 2px;\n        text-transform: uppercase;\n        color: #555;\n        transition: color 0.6s;\n    }\n    .deploy-status .dot {\n        width: 7px;\n        height: 7px;\n        border-radius: 50%;\n        background: #ff3b3b;\n        box-shadow: 0 0 8px #ff3b3b;\n        transition: all 0.6s;\n    }\n    .deploy-status.live { color: #00e06c; }\n    .deploy-status.live .dot {\n        background: #00e06c;\n        box-shadow: 0 0 12px #00e06c;\n    }\n\n    .deploy-btn {\n        width: 190px;\n        padding: 14px 0;\n        border-radius: 8px;\n        border: none;\n        background: linear-gradient(180deg, #ff5500, #e03d00);\n        color: #fff;\n        font-family: 'Arial', Helvetica, sans-serif;\n        font-size: 0.95rem;\n        font-weight: 700;\n        letter-spacing: 4px;\n        cursor: pointer;\n        transition: all 0.2s;\n        text-transform: uppercase;\n        box-shadow: 0 4px 16px rgba(255,77,0,0.3);\n    }\n    .deploy-btn:hover {\n        background: linear-gradient(180deg, #ff6a2a, #ff4d00);\n        box-shadow: 0 6px 24px rgba(255,77,0,0.45);\n        transform: translateY(-1px);\n    }\n    .deploy-btn:active {\n        transform: translateY(1px);\n        box-shadow: 0 2px 8px rgba(255,77,0,0.2);\n    }\n    .deploy-btn:disabled {\n        background: #333;\n        color: #666;\n        cursor: not-allowed;\n        box-shadow: none;\n        transform: none;\n    }\n\n    .deploy-msg {\n        font-family: monospace;\n        font-size: 0.7rem;\n        color: #444;\n        text-align: center;\n        min-height: 1em;\n        letter-spacing: 1px;\n        transition: color 0.5s;\n    }\n    .deploy-msg.ok { color: #00e06c; }\n    .deploy-msg.err { color: #ff3b3b; }\n\u003c/style>\n\n\u003cdiv class=\"deploy-container\">\n    \u003cdiv class=\"deploy-panel\">\n        \u003cdiv class=\"deploy-logo\">SOLARIS\u003c/div>\n\n        \u003cdiv class=\"deploy-status\" id=\"status\">\n            \u003cdiv class=\"dot\">\u003c/div>\n            \u003cspan id=\"status-text\">לא מחובר\u003c/span>\n        \u003c/div>\n\n        \u003cbutton class=\"deploy-btn\" id=\"deploy-btn\" onclick=\"deploy()\">הפעלה\u003c/button>\n\n        \u003cdiv class=\"deploy-msg\" id=\"msg\">\u003c/div>\n    \u003c/div>\n\u003c/div>\n\n\u003cscript type=\"application/json\" id=\"prefab-params\">\n{\n    \"flag\": { \"type\": \"text\", \"label\": \"דגל להפעלה (Set Flag)\", \"default\": \"solaris_deployed\" },\n    \"sound\": { \"type\": \"text\", \"label\": \"צליל הפעלה (Sound URL / pool:name)\", \"default\": \"\" }\n}\n\u003c/script>\n\n\u003cscript>\n    const btn = document.getElementById('deploy-btn');\n    const status = document.getElementById('status');\n    const statusText = document.getElementById('status-text');\n    const msg = document.getElementById('msg');\n\n    function deploy() {\n        if (btn.disabled) return;\n\n        btn.disabled = true;\n        btn.textContent = 'מפעיל...';\n        msg.textContent = '';\n        msg.className = 'deploy-msg';\n\n        try {\n            // Fire the global flag — permanent (no duration = stays true forever)\n            GameAPI.triggerGlobal('solaris_live');\n\n            // Set the activation flag from params\n            if (GameAPI.params.flag) {\n                GameAPI.setFlag(GameAPI.params.flag);\n            }\n\n            // Play activation sound from params\n            if (GameAPI.params.sound) {\n                GameAPI.playSound(GameAPI.params.sound);\n            }\n\n            // Visual feedback after a beat\n            setTimeout(() => {\n                status.classList.add('live');\n                statusText.textContent = 'פעיל';\n                btn.textContent = 'הופעל';\n                msg.textContent = 'SOLARIS מחובר לרשת.';\n                msg.className = 'deploy-msg ok';\n\n                // Gray out the whole panel\n                document.querySelector('.deploy-panel').style.opacity = '0.35';\n                document.querySelector('.deploy-panel').style.filter = 'grayscale(1)';\n                document.querySelector('.deploy-logo').style.textShadow = 'none';\n\n                try { GameAPI.playPool('confirm'); } catch(e) {}\n            }, 1200);\n\n        } catch(e) {\n            btn.disabled = false;\n            btn.textContent = 'הפעלה';\n            msg.textContent = 'ההפעלה נכשלה. נסה שוב.';\n            msg.className = 'deploy-msg err';\n        }\n    }\n\u003c/script>",

                    "html": "\u003cstyle>\n    .pl-container {\n        width: 100%;\n        height: 100%;\n        display: flex;\n        justify-content: center;\n        align-items: center;\n        font-family: monospace;\n        -webkit-user-select: none;\n        user-select: none;\n    }\n    .pl-panel {\n        background: #0d0d0d;\n        padding: 32px 36px;\n        border-radius: 14px;\n        border: 1px solid #222;\n        box-shadow: 0 20px 60px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);\n        display: flex;\n        flex-direction: column;\n        align-items: center;\n        gap: 18px;\n    }\n    .pl-title {\n        font-size: 0.75rem;\n        letter-spacing: 3px;\n        color: #555;\n        text-transform: uppercase;\n    }\n    .pl-svg {\n        width: 300px;\n        height: 300px;\n        display: block;\n        touch-action: none;\n    }\n    .pl-dot-ring {\n        fill: #0d0d0d;\n        stroke: #333;\n        stroke-width: 2;\n        transition: stroke 0.15s, stroke-width 0.15s, fill 0.15s;\n    }\n    .pl-dot-core {\n        fill: #555;\n        transition: fill 0.15s;\n    }\n    .pl-dot.active .pl-dot-ring {\n        stroke: #ff4d00;\n        stroke-width: 3;\n    }\n    .pl-dot.active .pl-dot-core {\n        fill: #ff4d00;\n    }\n    .pl-line {\n        stroke: #ff4d00;\n        stroke-width: 4;\n        stroke-linecap: round;\n        stroke-linejoin: round;\n        fill: none;\n        pointer-events: none;\n        filter: drop-shadow(0 0 6px rgba(255, 77, 0, 0.6));\n    }\n    .pl-msg {\n        font-size: 0.75rem;\n        letter-spacing: 2px;\n        color: #444;\n        min-height: 1em;\n        text-transform: uppercase;\n        transition: color 0.4s;\n    }\n    .pl-msg.ok { color: #00e06c; }\n    .pl-msg.err { color: #ff3b3b; }\n    .pl-panel.error { animation: pl-shake 0.4s; }\n    .pl-panel.error .pl-line,\n    .pl-panel.error .pl-dot.active .pl-dot-ring {\n        stroke: #ff3b3b !important;\n    }\n    .pl-panel.error .pl-dot.active .pl-dot-core {\n        fill: #ff3b3b !important;\n    }\n    .pl-panel.solved .pl-svg { pointer-events: none; opacity: 0.7; }\n    @keyframes pl-shake {\n        0%, 100% { transform: translateX(0); }\n        20% { transform: translateX(-8px); }\n        40% { transform: translateX(8px); }\n        60% { transform: translateX(-6px); }\n        80% { transform: translateX(6px); }\n    }\n\u003c/style>\n\n\u003cdiv class=\"pl-container\">\n    \u003cdiv class=\"pl-panel\" id=\"pl-panel\">\n        \u003cdiv class=\"pl-title\">קוד תבנית\u003c/div>\n        \u003csvg class=\"pl-svg\" id=\"pl-svg\" viewBox=\"0 0 300 300\">\n            \u003cpolyline id=\"pl-path\" class=\"pl-line\" points=\"\">\u003c/polyline>\n            \u003cline id=\"pl-trail\" class=\"pl-line\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"0\" style=\"display:none;\">\u003c/line>\n            \u003cg id=\"pl-dots\">\u003c/g>\n        \u003c/svg>\n        \u003cdiv class=\"pl-msg\" id=\"pl-msg\">&nbsp;\u003c/div>\n    \u003c/div>\n\u003c/div>\n\n\u003cscript type=\"application/json\" id=\"prefab-params\">\n{\n    \"code\": { \"type\": \"text\", \"label\": \"קוד (1-9, מופרד בפסיקים, למשל 1,5,9,6,3)\", \"default\": \"1,2,3,6,9,8,7,4,5\" },\n    \"successFlag\": { \"type\": \"text\", \"label\": \"דגל להצלחה (Set Flag)\", \"default\": \"pattern_solved\" },\n    \"successSound\": { \"type\": \"text\", \"label\": \"צליל הצלחה (URL / pool:name)\", \"default\": \"\" },\n    \"errorSound\": { \"type\": \"text\", \"label\": \"צליל שגיאה (URL / pool:name)\", \"default\": \"\" },\n    \"closeOnSuccess\": { \"type\": \"select\", \"label\": \"סגור אוטומטית אחרי הצלחה\", \"options\": [\"yes\", \"no\"], \"default\": \"yes\" }\n}\n\u003c/script>\n\n\u003cscript>\n(function() {\n    const svg = document.getElementById('pl-svg');\n    const panel = document.getElementById('pl-panel');\n    const path = document.getElementById('pl-path');\n    const trail = document.getElementById('pl-trail');\n    const dotsGroup = document.getElementById('pl-dots');\n    const msg = document.getElementById('pl-msg');\n\n    // 1-indexed dot positions. 1=top-left, 3=top-right, 5=center, 9=bottom-right.\n    const POS = {\n        1: [50, 50],  2: [150, 50],  3: [250, 50],\n        4: [50, 150], 5: [150, 150], 6: [250, 150],\n        7: [50, 250], 8: [150, 250], 9: [250, 250]\n    };\n    const HIT_R = 42; // generous hit radius so drags feel smooth\n\n    // Android-style pass-through: dragging over the midpoint auto-includes it.\n    const PASS = {\n        '1-3': 2, '3-1': 2, '4-6': 5, '6-4': 5, '7-9': 8, '9-7': 8,\n        '1-7': 4, '7-1': 4, '2-8': 5, '8-2': 5, '3-9': 6, '9-3': 6,\n        '1-9': 5, '9-1': 5, '3-7': 5, '7-3': 5\n    };\n\n    const params = (window.GameAPI && window.GameAPI.params) || {};\n    const rawCode = (params.code != null ? params.code : '').toString();\n    const targetSeq = rawCode.split(',').map(s => parseInt(s.trim(), 10)).filter(n => n >= 1 && n \u003c= 9);\n    const closeOnSuccess = (params.closeOnSuccess || 'yes') !== 'no';\n\n    // Build dots\n    const dotEls = {};\n    Object.keys(POS).forEach(k => {\n        const n = parseInt(k, 10);\n        const [x, y] = POS[n];\n        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');\n        g.setAttribute('class', 'pl-dot');\n        g.dataset.num = n;\n\n        const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');\n        ring.setAttribute('class', 'pl-dot-ring');\n        ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.setAttribute('r', 22);\n        g.appendChild(ring);\n\n        const core = document.createElementNS('http://www.w3.org/2000/svg', 'circle');\n        core.setAttribute('class', 'pl-dot-core');\n        core.setAttribute('cx', x); core.setAttribute('cy', y); core.setAttribute('r', 6);\n        g.appendChild(core);\n\n        dotsGroup.appendChild(g);\n        dotEls[n] = g;\n    });\n\n    let sequence = [];\n    let isDragging = false;\n    let solved = false;\n    let audioCtx = null;\n\n    function beep() {\n        try {\n            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n            if (audioCtx.state === 'suspended') audioCtx.resume();\n            const now = audioCtx.currentTime;\n            const osc = audioCtx.createOscillator();\n            const gain = audioCtx.createGain();\n            osc.type = 'sine';\n            osc.frequency.value = 880;\n            gain.gain.setValueAtTime(0.0001, now);\n            gain.gain.exponentialRampToValueAtTime(0.18, now + 0.005);\n            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);\n            osc.connect(gain).connect(audioCtx.destination);\n            osc.start(now);\n            osc.stop(now + 0.1);\n        } catch(_) {}\n    }\n\n    function svgPoint(e) {\n        const rect = svg.getBoundingClientRect();\n        const vb = svg.viewBox.baseVal;\n        return {\n            x: (e.clientX - rect.left) * (vb.width / rect.width),\n            y: (e.clientY - rect.top) * (vb.height / rect.height)\n        };\n    }\n    function dotAt(pt) {\n        for (const k in POS) {\n            const n = parseInt(k, 10);\n            const dx = pt.x - POS[n][0], dy = pt.y - POS[n][1];\n            if (dx * dx + dy * dy \u003c= HIT_R * HIT_R) return n;\n        }\n        return null;\n    }\n    function pushDot(n) {\n        sequence.push(n);\n        dotEls[n].classList.add('active');\n        path.setAttribute('points', sequence.map(k => POS[k].join(',')).join(' '));\n        beep();\n    }\n    function clearSequence() {\n        sequence = [];\n        for (const k in dotEls) dotEls[k].classList.remove('active');\n        path.setAttribute('points', '');\n        trail.style.display = 'none';\n    }\n    function setMsg(text, cls) {\n        msg.textContent = text || ' ';\n        msg.className = 'pl-msg' + (cls ? ' ' + cls : '');\n    }\n    function validate() {\n        const match = sequence.length === targetSeq.length &&\n                      sequence.every((n, i) => n === targetSeq[i]);\n        if (!match) {\n            panel.classList.add('error');\n            setMsg('שגיאה — נסה שוב', 'err');\n            if (params.errorSound) { try { GameAPI.playSound(params.errorSound); } catch(e){} }\n            setTimeout(() => {\n                panel.classList.remove('error');\n                clearSequence();\n                setMsg('');\n            }, 800);\n            return;\n        }\n        solved = true;\n        panel.classList.add('solved');\n        setMsg('אומת', 'ok');\n        if (params.successFlag) { try { GameAPI.setFlag(params.successFlag); } catch(e){} }\n        if (params.successSound) { try { GameAPI.playSound(params.successSound); } catch(e){} }\n        if (closeOnSuccess) {\n            setTimeout(() => { try { GameAPI.close(); } catch(e){} }, 800);\n        }\n    }\n\n    svg.addEventListener('pointerdown', (e) => {\n        if (solved) return;\n        const pt = svgPoint(e);\n        const n = dotAt(pt);\n        if (!n) return;\n        e.preventDefault();\n        try { svg.setPointerCapture(e.pointerId); } catch(_) {}\n        isDragging = true;\n        clearSequence();\n        setMsg('');\n        pushDot(n);\n        trail.setAttribute('x1', POS[n][0]);\n        trail.setAttribute('y1', POS[n][1]);\n        trail.setAttribute('x2', pt.x);\n        trail.setAttribute('y2', pt.y);\n        trail.style.display = 'block';\n    });\n\n    svg.addEventListener('pointermove', (e) => {\n        if (!isDragging) return;\n        const pt = svgPoint(e);\n        const last = sequence[sequence.length - 1];\n        trail.setAttribute('x1', POS[last][0]);\n        trail.setAttribute('y1', POS[last][1]);\n        trail.setAttribute('x2', pt.x);\n        trail.setAttribute('y2', pt.y);\n        const n = dotAt(pt);\n        if (n && !sequence.includes(n)) {\n            const mid = PASS[last + '-' + n];\n            if (mid && !sequence.includes(mid)) pushDot(mid);\n            pushDot(n);\n        }\n    });\n\n    function endDrag(e) {\n        if (!isDragging) return;\n        isDragging = false;\n        try { svg.releasePointerCapture(e.pointerId); } catch(_) {}\n        trail.style.display = 'none';\n        if (sequence.length > 0) validate();\n    }\n    svg.addEventListener('pointerup', endDrag);\n    svg.addEventListener('pointercancel', endDrag);\n})();\n\u003c/script>\n",
