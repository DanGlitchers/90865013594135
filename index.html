                    // any player flips a global flag) we MUST leave the in-flight
                    // intro alone — pausing + load()'ing it kills the 'ended' event
                    // before markSeen can set the once-flag, which is why
                    // "Play only once" appeared to stop working.
                    // A user-initiated navigation away (this branch) DOES count as
                    // "watched" — we run any registered _markSeenOnAbort first so the
                    // once-flag persists even if the player skipped past the intro.
                    if (window.activeRoomVideos) {
                        window.activeRoomVideos.forEach(v => {
                            try {
                                if (v._markSeenOnAbort)
                                    v._markSeenOnAbort();
                            } catch (err) {}
                            try {
                                v.pause();
                                v.removeAttribute('src');
                                v.load();
                            } catch (err) {}
                        }
                        );
                    }
                    window.activeRoomVideos = [];
                }

                currentRoomHash = targetHash;
                saveGame();
                backBtn.style.display = (!HIDE_BACK_GLOBAL && roomHistory.length > 0 && !roomData.hideBackBtn) ? 'inline-block' : 'none';
                const replayBtn = document.getElementById('replay-narration-btn');
                if (replayBtn) {
                    replayBtn.style.display = (roomData.narrationUrl && roomData.narrationOnce !== false) ? 'inline-block' : 'none';
                }

                const bgAssets = determineBackground(roomData);
                let finalBg = bgAssets.imageUrl;

                // Intro video: start loading in parallel with bg preload so playback is instant.
                // Only plays on fresh forward entries (not silent internal reloads, not back/resume).
                // If introVideoOnce is set, skip after the first successful playback in this save.
                let introVid = null;
                const introOnceFlag = 'intro_vid_' + targetHash;
                const introSkipOnce = roomData.introVideoOnce && flags[introOnceFlag];
                if (roomData.introVideoUrl && !isResumeOrBack && !isSilent && !introSkipOnce) {
                    introVid = document.createElement('video');
                    introVid.src = roomData.introVideoUrl;
                    introVid.preload = 'auto';
                    introVid.playsInline = true;
                    introVid.muted = false;
                    introVid.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:5; pointer-events:auto; background:#000; opacity:1;';
                    introVid.load();
                }

                if (!isSilent) {
                    // Kick off hotspot audio preloads in parallel with the bg image preload,
                    // so first-click latency on hotspot SFX is just decode time, not network.
                    preloadRoomAudio(roomData);

                    const bgsToLoad = [];
                    if (roomData.backgroundImage)
                        bgsToLoad.push(roomData.backgroundImage);
                    if (roomData.bgOverrides) {
                        roomData.bgOverrides.forEach(ov => {
                            if (ov.url)
                                bgsToLoad.push(ov.url);
                        }
                        );
                    } else if (roomData.overrideBgUrl) {
                        bgsToLoad.push(roomData.overrideBgUrl);
                    }
                    const preloads = bgsToLoad.map(src => new Promise(res => {
                        const img = new Image();
                        img.onload = res;
                        img.onerror = res;
                        img.src = src;
                    }
                    ));
                    if (introVid) {
                        preloads.push(new Promise(res => {
                            const done = () => res();
                            introVid.addEventListener('canplay', done, {
                                once: true
                            });
                            introVid.addEventListener('error', done, {
                                once: true
                            });
                            setTimeout(done, 5000);
                        }
                        ));
                    }
                    if (preloads.length > 0) {
                        await Promise.all(preloads);
                    }

                    // A newer loadRoom call has superseded this one — abort audio side effects
                    // so a stale (slow-loading) navigation can't overwrite the current room's audio.
                    // Release the JIT loader before returning: the superseder may be silent
                    // (e.g. setupGlobalListener's debounced reload after a CF global write),
                    // and silent reloads skip the line 2894 hide. Without this, a non-silent
                    // loadRoom that loses the race leaves #jit-loader stuck visible — which
                    // surfaces as "stuck on loading" after the BlackSun finale unlock.
                    if (myGen !== loadRoomGen) {
                        jit.style.display = 'none';
                        return;
                    }

                    playAmbience(roomData.ambienceUrl || "", roomData.ambienceZone || "");
                    resumeActiveLoops(roomData.roomLoopIds || []);
                    playNarration(roomData.narrationUrl || "", roomData.narrationOnce !== false, targetHash, roomData.narrationLock !== false);
                }

                if (finalBg) {
                    gc.style.backgroundImage = `url('${finalBg.replace(/'/g, "\\'")}')`;
                } else {
                    gc.style.backgroundImage = 'none';
                }
                applyBgVideo(bgAssets.videoUrl);
                applyBgAudio(bgAssets.audioUrl);

                // Intro video overlay: plays once on top of the static bg, then fades out 500ms to reveal it.
                if (introVid) {
                    gc.appendChild(introVid);
                    window.activeRoomVideos.push(introVid);
                    const markSeen = () => {
                        if (roomData.introVideoOnce && !flags[introOnceFlag]) {
                            flags[introOnceFlag] = true;
                            saveGame();
                        }
                    }
                    ;
                    // Stashed on the element so the room-change cleanup can call it
                    // before pause+load() kills 'ended'. A deliberate navigation away
                    // counts as "had your chance" — but only if the video actually
                    // started (currentTime > 0); pre-roll errors should still replay.
                    introVid._markSeenOnAbort = () => {
                        if (introVid.currentTime > 0)
                            markSeen();
                    }
                    ;
                    const fadeOut = () => {
                        introVid.style.transition = 'opacity 500ms ease-out';
                        void introVid.offsetWidth;
                        introVid.style.opacity = '0';
                        setTimeout( () => {
                            try {
                                introVid.remove();
                            } catch (e) {}
                            try {
                                window.dispatchEvent(new CustomEvent('nehoran:introvid-end'));
                            } catch (e) {}
                        }
                        , 550);
                    }
                    ;
                    // Only count as "watched" on natural completion. 'error' or
                    // mid-play cleanup from a new loadRoom must NOT set the once-flag, so a
                    // player who didn't see the intro through gets it again on next entry.
                    introVid.addEventListener('ended', markSeen, {
                        once: true
                    });
                    introVid.addEventListener('ended', fadeOut, {
                        once: true
                    });
                    introVid.addEventListener('error', fadeOut, {
                        once: true
                    });
                    const p = introVid.play();
                    if (p && p.catch)
                        p.catch( () => {
                            introVid.muted = true;
                            introVid.play().catch(fadeOut);
                        }
                        );
                }

                // Rebuild FADE VISUALS if any are active
                const fxElem = document.getElementById('fx-overlay');
                if (_fadeJustCompleted) {
                    _fadeJustCompleted = false;
                    fxElem.style.transition = 'none';
                    fxElem.style.opacity = 1;
                    void fxElem.offsetWidth;
                    fxElem.style.transition = 'opacity 0.8s ease-out';
                    fxElem.style.opacity = 0;
                } else {
                    fxElem.style.transition = 'none';
                    fxElem.style.opacity = 0;
                }
                let activeFadeAction = null;
                if (roomData.hotspots) {
                    roomData.hotspots.forEach(spot => {
                        if (spot.action.type === 'start_fade') {
                            const targetFlag = spot.action.fadeFlag;
                            if (flags[`sys_fade_start_${targetFlag}`] && !flags[targetFlag]) {
                                activeFadeAction = spot.action;
                            }
                        }
                    }
                    );
                }
                if (activeFadeAction) {
                    rec('FADE_RESUME', {
                        fadeFlag: activeFadeAction.fadeFlag,
                        elapsed: Date.now() - flags[`sys_fade_start_${activeFadeAction.fadeFlag}`]
                    });
                    const startTime = flags[`sys_fade_start_${activeFadeAction.fadeFlag}`];
                    const durMs = flags[`sys_fade_dur_${activeFadeAction.fadeFlag}`];
                    const elapsed = Date.now() - startTime;
                    if (elapsed < durMs) {
                        fxElem.style.backgroundImage = `url('${activeFadeAction.fadeUrl}')`;
                        fxElem.style.opacity = elapsed / durMs;
                        void fxElem.offsetWidth;
                        fxElem.style.transition = `opacity ${durMs - elapsed}ms linear`;
                        fxElem.style.opacity = 1;
                    }
                } else if (roomData.hotspots) {
                    // Auto-start: if a start_fade hotspot has autoStartFlags and ALL are active, begin the fade
                    for (const spot of roomData.hotspots) {
                        if (spot.action.type !== 'start_fade' || !spot.action.fadeFlag || !spot.action.autoStartFlags || spot.action.autoStartFlags.length === 0)
                            continue;
                        const ff = spot.action.fadeFlag;
                        const skip_running = !!flags[`sys_fade_start_${ff}`];
                        const skip_done = !!flags[ff];
                        const allActive = spot.action.autoStartFlags.every(f => isFlagActive(f));
                        rec('FADE_AUTOSTART_CHECK', {
                            hotspotId: spot.id,
                            fadeFlag: ff,
                            autoStartFlags: spot.action.autoStartFlags,
                            skip_running,
                            skip_done,
                            allFlagsActive: allActive
                        });
                        if (skip_running || skip_done || !allActive)
                            continue;
                        rec('FADE_AUTOSTART_GO', {
                            hotspotId: spot.id,
                            fadeFlag: ff
                        });
                        const durMs = (Number(spot.action.fadeDuration) || 5) * 1000;
                        flags[`sys_fade_start_${ff}`] = Date.now();
                        flags[`sys_fade_dur_${ff}`] = durMs;
                        flags[`sys_fade_url_${ff}`] = spot.action.fadeUrl;
                        flags[`sys_fade_thresh_${ff}`] = (Number(spot.action.fadeThreshold) || 50) / 100;
                        saveGame();
                        fxElem.style.backgroundImage = `url('${spot.action.fadeUrl}')`;
                        void fxElem.offsetWidth;
                        fxElem.style.transition = `opacity ${durMs}ms linear`;
                        fxElem.style.opacity = 1;
                        if (spot.action.audio)
                            playSound(spot.action.audio);
                        if (spot.action.loopStartId && spot.action.loopStartUrl)
                            startLoopSound(spot.action.loopStartId, spot.action.loopStartUrl, (Number(spot.action.loopStartVolume) || 50) / 100);
                        break;
                    }
                }

                // Rebuild Hotspot & Video Layer
                hl.innerHTML = '';
                let defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
                defs.id = "room-defs";
                hl.appendChild(defs);

                ib.innerHTML = '<div style="margin-left: 10px; color: var(--terminal-dark);">מלאי ציוד:</div>';
                inventory.forEach(itemId => {
                    const itemDef = gameItems[itemId];
                    if (!itemDef)
                        return;
                    let d = document.createElement('div');
                    d.className = 'inventory-item';
                    d.title = itemDef.name;
                    d.draggable = true;
                    d.ondragstart = (e) => window.dragStart(e, itemId);
                    if (itemDef.iconUrl)
                        d.style.backgroundImage = `url('${itemDef.iconUrl}')`;
                    else
                        d.innerHTML = `<span>${itemDef.name}</span>`;
                    d.onclick = () => {
                        if (document.getElementById('use-modal-overlay').style.display === 'flex')
                            window.handleItemTry(itemId);
                        else
                            window.openModal(itemDef.name, "מונח במלאי הציוד שלך.");
                    }
                    ;
                    ib.appendChild(d);
                }
                );

                if (roomData.hotspots) {
                    roomData.hotspots.forEach(spot => {
                        if (!evaluateConditions(spot))
                            return;
                        if (spot.action.type === 'collect' && Array.isArray(inventory) && inventory.includes(spot.action.itemId))
                            return;

                        if (spot.action.type === 'video_loop' && spot.action.videoUrl) {
                            const ptsArr = spot.points.split(' ').map(p => p.split(',').map(Number));
                            const minX = Math.min(...ptsArr.map(p => p[0]));
                            const maxX = Math.max(...ptsArr.map(p => p[0]));
                            const minY = Math.min(...ptsArr.map(p => p[1]));
                            const maxY = Math.max(...ptsArr.map(p => p[1]));
                            const w = maxX - minX;
                            const h = maxY - minY;

                            const clipId = "clip-" + spot.id.replace(/[^a-zA-Z0-9-_]/g, '');
                            const clipPath = document.createElementNS("http://www.w3.org/2000/svg", "clipPath");
                            clipPath.setAttribute("id", clipId);
                            const clipPoly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                            clipPoly.setAttribute("points", spot.points);
                            clipPath.appendChild(clipPoly);
                            defs.appendChild(clipPath);

                            const fo = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
                            fo.setAttribute("x", minX);
                            fo.setAttribute("y", minY);
                            fo.setAttribute("width", w);
                            fo.setAttribute("height", h);
                            fo.setAttribute("clip-path", `url(#${clipId})`);
                            fo.style.pointerEvents = "none";

                            const vid = document.createElementNS("http://www.w3.org/1999/xhtml", "video");
                            vid.src = spot.action.videoUrl;
                            vid.autoplay = true;
                            vid.loop = true;
                            vid.muted = false;
                            vid.playsInline = true;
                            vid.volume = (Number(spot.action.videoVolume) || 0) / 100;
                            vid.style.width = "100%";
                            vid.style.height = "100%";
                            vid.style.objectFit = "cover";
                            vid.style.pointerEvents = "none";

                            window.activeRoomVideos.push(vid);
                            fo.appendChild(vid);
                            hl.appendChild(fo);

                            // Non-hoverable video loops don't need a polygon at all — and a
                            // class-less polygon would default to fill:black and cover the video.
                            if (spot.action.videoNoHover)
                                return;
                        }

                        const shape = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                        shape.setAttribute("id", spot.id);
                        shape.setAttribute("points", spot.points);

                        if (spot.action.type === 'video_loop' && spot.action.videoNoHover) {
                            shape.style.pointerEvents = "none";
                        } else {
                            if (spot.action.type === 'navigate' && spot.action.isBackBtn) {
                                shape.setAttribute("class", "svg-back-btn");
                            } else {
                                shape.setAttribute("class", "svg-hotspot");
                            }
                            shape.addEventListener('click', () => executeAction(spot.action, spot.id));
                            const acceptedEntries = getUseItemEntries(spot.action);
                            if (spot.action.type === 'use_item' && acceptedEntries.length) {
                                shape.addEventListener('dragenter', (e) => {
                                    e.preventDefault();
                                    shape.classList.add('drop-target');
                                }
                                );
                                shape.addEventListener('dragover', (e) => {
                                    e.preventDefault();
                                }
                                );
                                shape.addEventListener('dragleave', () => {
                                    shape.classList.remove('drop-target');
                                }
                                );
                                shape.addEventListener('drop', async (e) => {
                                    e.preventDefault();
                                    shape.classList.remove('drop-target');
                                    const droppedItem = e.dataTransfer.getData('text/plain');
                                    if (isExecutingAction)
                                        return;
                                    const matchEntry = acceptedEntries.find(en => en.itemId === droppedItem);
                                    if (matchEntry) {
                                        isExecutingAction = true;
                                        shape.classList.add('drop-success');
                                        const eff = buildEffectiveUseAction(spot.action, matchEntry);
                                        if (eff.audio)
                                            playSound(eff.audio);
                                        await new Promise(r => setTimeout(r, 300));
                                        await applyActionFlagsAndReload(eff);
                                        if (eff.consumeItem) {
                                            inventory = inventory.filter(i => i !== droppedItem);
                                            saveGame();
                                            await loadRoom(currentRoomHash, true, true);
                                        }
                                        if (eff.successAction) {
                                            if (eff.successAction.audio)
                                                playSound(eff.successAction.audio);
                                            if (eff.successAction.targetRoom) {
                                                const h = await createHash(eff.successAction.targetRoom + SALT);
                                                if (eff.successAction.fadeOut)
                                                    await fadeOutAndNav(h, eff.isCheckpoint);
                                                else
                                                    loadRoom(h, false, false, eff.isCheckpoint);
                                            }
                                        }
                                        isExecutingAction = false;
                                    }
                                }
                                );
                            }
                        }
                        hl.appendChild(shape);
                    }
                    );
                }
                if (!isSilent)
                    jit.style.display = 'none';

                // autoOpen scan: any open_prefab hotspot with action.autoOpen and
                // passing conditions opens its prefab on room entry. Skipped if a
                // prefab is already mounted (e.g. this loadRoom is a same-room
                // refresh after a flag flip).
                if (!_activePrefabContext && roomData.hotspots) {
                    for (const spot of roomData.hotspots) {
                        if (!spot.action || spot.action.type !== 'open_prefab' || !spot.action.autoOpen)
                            continue;
                        if (!evaluateConditions(spot))
                            continue;
                        rec('PREFAB_AUTOOPEN', {
                            hotspotId: spot.id,
                            prefabId: spot.action.prefabId
                        });
                        _openPrefabById(spot.action.prefabId, {
                            mountQuad: spot.action.mountQuad,
                            autoOpen: true
                        });
                        break;
                        // one autoOpen per room
                    }
                }

                if (window._fadeInNextRoom) {
                    window._fadeInNextRoom = false;
                    const fadeIn = document.createElement('div');
                    fadeIn.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9998;transition:opacity 800ms ease-out;pointer-events:none;';
                    document.body.appendChild(fadeIn);
                    requestAnimationFrame( () => {
                        fadeIn.style.opacity = '0';
                    }
                    );
                    fadeIn.addEventListener('transitionend', () => fadeIn.remove());
                }

                // Forced load-dialogue gate. Fires on every non-silent entry —
                // including resume/back — so a refresh on the gate room can't
                // bypass it. If an intro video is playing, defer until it ends
                // (otherwise the modal pops on top of the cutscene).
                const ld = roomData.loadDialogue;
                const ldEligible = !!(ld && ld.enabled);
                const ldFire = ldEligible && !isSilent;
                const ldDeferred = ldFire && !!introVid;
                rec('LOAD_DIALOGUE', {
                    hasField: !!ld,
                    enabled: !!(ld && ld.enabled),
                    eligible: ldEligible,
                    fire: ldFire,
                    deferred: ldDeferred,
                    isResumeOrBack,
                    isSilent
                });
                if (ldFire) {
                    const showLoadDialogue = () => window.openDialogueModal({
                        title: ld.title || "",
                        text: ld.text,
                        confirmText: ld.confirmText || "המשך",
                        targetRoom: ld.targetRoom || "",
                        isCheckpoint: !!ld.isCheckpoint,
                        hideCancel: true
                    });
                    if (introVid) {
                        window.addEventListener('nehoran:introvid-end', showLoadDialogue, {
                            once: true
                        });
                    } else {
                        showLoadDialogue();
                    }
                }
            }

            window.goBack = function() {
                let prev = null;
                while (roomHistory.length > 0) {
                    prev = roomHistory.pop();
                    if (prev !== currentRoomHash)
                        break;
                    prev = null;
                }
                if (prev) {
                    loadRoom(prev, true, false);
                } else {
                    backBtn.style.display = 'none';
                }
            }

            function getUseItemEntries(action) {
                if (Array.isArray(action.requiredItems) && action.requiredItems.length) {
                    return action.requiredItems.map(e => (typeof e === 'string') ? {
                        itemId: e
                    } : e);
                }
                return action.requiredItem ? [{
                    itemId: action.requiredItem
                }] : [];
            }
            function buildEffectiveUseAction(action, entry) {
                const eff = Object.assign({}, action);
                if (entry) {
                    if (Array.isArray(entry.setFlags) && entry.setFlags.length) {
                        eff.setFlags = entry.setFlags.slice();
                        delete eff.setFlag;
                    }
                    if (Array.isArray(entry.removeFlags) && entry.removeFlags.length) {
                        eff.removeFlags = entry.removeFlags.slice();
                        delete eff.removeFlag;
                    }
                    if (entry.targetRoom || entry.audio) {
                        eff.successAction = Object.assign({
                            type: 'navigate'
                        }, action.successAction || {});
                        if (entry.targetRoom)
                            eff.successAction.targetRoom = entry.targetRoom;
                        if (entry.audio)
                            eff.successAction.audio = entry.audio;
                    }
                }
                return eff;
            }

            async function applyActionFlagsAndReload(action) {
                rec('APPLY_FLAGS', {
                    type: action.type,
                    setFlag: action.setFlag,
                    removeFlag: action.removeFlag,
                    setFlags: action.setFlags,
                    removeFlags: action.removeFlags
                });
                let flagChanged = false;

                // Legacy Support
                if (action.setFlag) {
                    flags[action.setFlag] = true;
                    flagChanged = true;
                }
                if (action.removeFlag) {
                    delete flags[action.removeFlag];
                    flagChanged = true;
                }

                // New Array Support
                if (action.setFlags && Array.isArray(action.setFlags)) {
                    action.setFlags.forEach(f => {
                        if (f) {
                            flags[f] = true;
                            flagChanged = true;
                        }
                    }
                    );
                }
                if (action.removeFlags && Array.isArray(action.removeFlags)) {
                    action.removeFlags.forEach(f => {
                        if (f) {
                            delete flags[f];
                            flagChanged = true;
                        }
                    }
                    );
                }

                if (flagChanged) {
                    saveGame();
                    await loadRoom(currentRoomHash, true, true);
                }
            }

            async function fadeOutAndNav(targetRoom, isCheckpoint) {
                const overlay = document.createElement('div');
                overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;opacity:0;z-index:9998;pointer-events:all;transition:opacity 600ms ease-in;';
                document.body.appendChild(overlay);
                await new Promise(r => {
                    const done = () => {
                        clearTimeout(t);
                        r();
                    }
                    ;
                    const t = setTimeout(done, 750);
                    overlay.addEventListener('transitionend', done, {
                        once: true
                    });
                    requestAnimationFrame( () => requestAnimationFrame( () => {
                        overlay.style.opacity = '1';
                    }
                    ));
                }
                );
                await loadRoom(targetRoom, false, false, isCheckpoint);
                overlay.style.transition = 'opacity 800ms ease-out';
                requestAnimationFrame( () => requestAnimationFrame( () => {
                    overlay.style.opacity = '0';
                }
                ));
                overlay.addEventListener('transitionend', () => overlay.remove(), {
                    once: true
                });
                setTimeout( () => overlay.remove(), 900);
            }

            async function executeAction(action, elementId=null) {
                if (!action || isExecutingAction) {
                    rec('ACTION_BLOCKED', {
                        type: action?.type,
                        elementId,
                        reason: !action ? 'no_action' : 'busy'
                    });
                    return;
                }
                isExecutingAction = true;
                rec('ACTION_EXEC', {
                    type: action.type,
                    elementId,
                    setFlag: action.setFlag,
                    removeFlag: action.removeFlag,
                    setFlags: action.setFlags,
                    removeFlags: action.removeFlags
                });

                try {
                    if (action.audio)
                        playSound(action.audio);
                    if (action.narrationUrl) {
                        const nFlag = 'hs_narrated_' + (currentRoomHash || '') + '_' + (elementId || '');
                        const hsPlayOnce = action.narrationOnce !== false;
                        if (!hsPlayOnce || !flags[nFlag]) {
                            fadeOutNarration( () => {
                                narrationAudio.src = action.narrationUrl;
                                narrationAudio.volume = getNarrationVol();
                                duckAmbience(AMBIENCE_DUCK_VOLUME);
                                document.getElementById('narration-indicator').classList.add('active');
                                narrationAudio.play().catch(e => {
                                    console.log("Narration blocked:", e);
                                    document.getElementById('narration-indicator').classList.remove('active');
                                }
                                );
                                narrationAudio.onended = () => {
                                    duckAmbience(1);
                                    document.getElementById('narration-indicator').classList.remove('active');
                                }
                                ;
                            }
                            );
                            if (hsPlayOnce) {
                                flags[nFlag] = true;
                                saveGame();
                            }
                        }
                    }

                    switch (action.type) {
                    case 'interact':
                    case 'video_loop':
                        await applyActionFlagsAndReload(action);
                        break;
                    case 'examine':
                        await applyActionFlagsAndReload(action);
                        window.openModal(action.title, action.text, false, action.url, action.urlText);
                        break;
                    case 'game_over':
                        await applyActionFlagsAndReload(action);
                        window.openModal(action.title, action.text, true);
                        break;
                    case 'collect':
                        if (!Array.isArray(inventory))
                            inventory = [];
                        if (!inventory.includes(action.itemId)) {
                            inventory.push(action.itemId);
                            await applyActionFlagsAndReload(action);
                            saveGame();
                            if (!action.silent) {
                                const collectedItem = gameItems[action.itemId];
                                window.openModal("פריט נאסף", action.message || "", false, null, null, collectedItem && collectedItem.iconUrl ? collectedItem.iconUrl : null);
                            }
                            if (action.targetRoom) {
                                loadRoom(await createHash(action.targetRoom + SALT), false, false, action.isCheckpoint);
                            } else {
                                loadRoom(currentRoomHash, true, true);
                            }
                        }
                        break;
                    case 'navigate':
                        await applyActionFlagsAndReload(action);
                        if (action.targetRoom) {
                            const h = await createHash(action.targetRoom + SALT);
                            if (action.fadeOut)
                                await fadeOutAndNav(h, action.isCheckpoint);
                            else
                                loadRoom(h, false, false, action.isCheckpoint);
                        }
                        break;
                    case 'dialogue':
                        window.openDialogueModal(action);
                        break;
                    case 'use_item':
                        window.openUseModal(action);
                        break;
                    case 'input_code':
                        // Per-hotspot lockout: 5 wrong attempts → 30s cooldown.
                        // The hash check runs client-side (we have no Cloud Function),
                        // so without this a player can script ~10000 attempts/sec.
                        // Lockout state is keyed on the correctHash so it survives
                        // refresh and is unique per puzzle.
                        {
                            const codeHashKey = action.correctHash || "_nocode";
                            const lockKey = "nehoran_code_lock_" + codeHashKey;
                            const failKey = "nehoran_code_fails_" + codeHashKey;
                            const FAIL_LIMIT = 5;
                            const LOCK_MS = 30 * 1000;
                            const lockedUntil = parseInt(localStorage.getItem(lockKey) || "0", 10) || 0;
                            if (Date.now() < lockedUntil) {
                                const sec = Math.ceil((lockedUntil - Date.now()) / 1000);
                                window.openModal("נחסם", "המתן " + sec + " שניות לפני ניסיון נוסף.");
                                break;
                            }
                            window.openInputModal(action.title, action.promptText, async (inputVal) => {
                                if (await createHash(inputVal) === action.correctHash) {
                                    localStorage.removeItem(failKey);
                                    localStorage.removeItem(lockKey);
                                    window.closeModal();
                                    await applyActionFlagsAndReload(action);
                                    if (action.successAction) {
                                        if (action.successAction.audio)
                                            playSound(action.successAction.audio);
                                        if (action.successAction.targetRoom) {
                                            const h = await createHash(action.successAction.targetRoom + SALT);
                                            if (action.successAction.fadeOut)
                                                await fadeOutAndNav(h, action.isCheckpoint);
                                            else
                                                loadRoom(h, false, false, action.isCheckpoint);
                                        }
                                    }
                                } else {
                                    const fails = (parseInt(localStorage.getItem(failKey) || "0", 10) || 0) + 1;
                                    localStorage.setItem(failKey, String(fails));
                                    if (fails >= FAIL_LIMIT) {
                                        localStorage.setItem(lockKey, String(Date.now() + LOCK_MS));
                                        localStorage.removeItem(failKey);
                                    }
                                    if (action.audioFail)
                                        playSound(action.audioFail);
                                    window.openModal("שגיאה", action.failMessage);
                                }
                            }
                            );
                        }
                        break;
                    case 'trigger_global':
                        await applyActionFlagsAndReload(action);
                        if (!db) {
                            window.openModal("שגיאה", "אין חיבור למסד.");
                            break;
                        }
                        try {
                            await authReady;
                            let val = true;
                            if (action.duration && !isNaN(action.duration)) {
                                val = Date.now() + (Number(action.duration) * 1000);
                            }
                            await updateDoc(doc(db, "nehoran_facility", "global_state"), {
                                [action.triggerId]: val
                            });
                            if (action.processingMsg)
                                window.openModal("מעבד...", action.processingMsg);
                        } catch (e) {}
                        break;
                    case 'start_fade':
                        await applyActionFlagsAndReload(action);
                        const durMs = (Number(action.fadeDuration) || 5) * 1000;
                        flags[`sys_fade_start_${action.fadeFlag}`] = Date.now();
                        flags[`sys_fade_dur_${action.fadeFlag}`] = durMs;
                        flags[`sys_fade_url_${action.fadeFlag}`] = action.fadeUrl;
                        flags[`sys_fade_thresh_${action.fadeFlag}`] = (Number(action.fadeThreshold) || 50) / 100;
                        saveGame();

                        const fx = document.getElementById('fx-overlay');
                        fx.style.transition = 'none';
                        fx.style.opacity = 0;
                        fx.style.backgroundImage = `url('${action.fadeUrl}')`;
                        void fx.offsetWidth;
                        fx.style.transition = `opacity ${durMs}ms linear`;
                        fx.style.opacity = 1;
                        break;
                    case 'stop_fade':
                        const targetFlag = action.fadeFlag;
                        rec('STOP_FADE', {
                            fadeFlag: targetFlag,
                            activeFades: Object.keys(flags).filter(k => k.startsWith('sys_fade_start_')),
                            flags: {
                                ...flags
                            }
                        });
                        // Stop ALL active fades (there's only one overlay)
                        Object.keys(flags).forEach(key => {
                            if (!key.startsWith('sys_fade_start_'))
                                return;
                            const fadeName = key.replace('sys_fade_start_', '');
                            const startTime = flags[key];
                            const fadeDurMs = flags[`sys_fade_dur_${fadeName}`];
                            const thresh = flags[`sys_fade_thresh_${fadeName}`] || 0.5;
                            const elapsed = Date.now() - startTime;
                            if (fadeDurMs && (elapsed / fadeDurMs) >= thresh) {
                                flags[fadeName] = true;
                            }
                            delete flags[key];
                            delete flags[`sys_fade_dur_${fadeName}`];
                            delete flags[`sys_fade_url_${fadeName}`];
                            delete flags[`sys_fade_thresh_${fadeName}`];
                        }
                        );
                        // Also handle the named fade if tick already completed it
                        if (targetFlag && flags[targetFlag] && !flags[`sys_fade_start_${targetFlag}`]) {
                            delete flags[`sys_fade_dur_${targetFlag}`];
                            delete flags[`sys_fade_url_${targetFlag}`];
                            delete flags[`sys_fade_thresh_${targetFlag}`];
                        }
                        saveGame();

                        const fxElem = document.getElementById('fx-overlay');
                        if (fxElem) {
                            fxElem.style.transition = 'opacity 0.5s ease-out';
                            fxElem.style.opacity = 0;
                        }
                        await applyActionFlagsAndReload(action);
                        break;
                    case 'start_loop_sound':
                    case 'stop_loop_sound':
                        await applyActionFlagsAndReload(action);
                        break;
                    case 'open_prefab':
                        rec('PREFAB_DISPATCH', {
                            prefabId: action.prefabId,
                            mountQuad: action.mountQuad,
                            autoOpen: !!action.autoOpen
                        });
                        await applyActionFlagsAndReload(action);
                        await _openPrefabById(action.prefabId, {
                            mountQuad: action.mountQuad,
                            autoOpen: !!action.autoOpen
                        });
                        break;
                    }
                    // Shared loop sound handling (works with any action type)
                    if (action.loopStartId && action.loopStartUrl)
                        startLoopSound(action.loopStartId, action.loopStartUrl, (Number(action.loopStartVolume) || 50) / 100);
                    if (action.loopStopId)
                        action.loopStopId.split(',').map(s => s.trim()).filter(s => s).forEach(id => stopLoopSound(id));
                } catch (e) {
                    console.error("Action Initiation Error:", e);
                    window.openModal("שגיאת מערכת", "הפעולה נכשלה עקב שגיאה פנימית.");
                } finally {
                    isExecutingAction = false;
                }
            }

            function setupGlobalListener() {
                if (!db) {
                    document.getElementById('connection-status').innerText = "מנותק";
                    return;
                }
                document.getElementById('connection-status').innerText = "מחובר (סנכרון פעיל)";
                document.getElementById('connection-status').style.color = "#00ff41";

                // Debounce loadRoom calls so a burst of global_state writes (legitimate
                // or malicious) collapses into a single reload. Prior behavior reloaded
                // synchronously on each change, so spamming triggerGlobal could DoS
                // every connected player.
                let _globalReloadTimer = null;
                const _scheduleGlobalReload = () => {
                    if (_globalReloadTimer)
                        return;
                    _globalReloadTimer = setTimeout( () => {
                        _globalReloadTimer = null;
                        loadRoom(currentRoomHash, true, true);
                        updateDebug();
                    }
                    , 250);
                }
                ;

                onSnapshot(doc(db, "nehoran_facility", "global_state"), (docSnap) => {
                    if (docSnap.exists()) {
                        const newState = docSnap.data();
                        const changed = JSON.stringify(newState) !== JSON.stringify(globalState);
                        globalState = newState;

                        if (changed) {
                            _scheduleGlobalReload();
                        } else {
                            updateDebug();
                        }

                        Object.keys(globalState).forEach(key => {
                            const val = globalState[key];
                            if (typeof val === 'number') {
                                const remaining = val - Date.now();
                                if (remaining > 0) {
                                    if (globalTimeouts[key])
                                        clearTimeout(globalTimeouts[key]);
                                    globalTimeouts[key] = setTimeout( () => {
                                        _scheduleGlobalReload();
                                    }
                                    , remaining + 100);
                                }
                            }
                        }
                        );
                    }
                }
                , (err) => {
                    console.error("Global Sync Error:", err);
                }
                );
            }
        </script>
